<script>
  // Dette skriptet kjører med en gang meny.html lastes inn, før siden rekker å blinke
  (function() {
    const lagretBilde = localStorage.getItem("profilbilde");
    if (lagretBilde && lagretBilde !== "null" && lagretBilde.trim() !== "") {
      const imgEl = document.getElementById("menyProfilbilde");
      if (imgEl) {
        imgEl.src = lagretBilde;
      }
    }
  })();
</script>
