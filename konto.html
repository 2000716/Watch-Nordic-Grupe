<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Min Konto | Watch Nordic™</title>

  <link rel="icon" type="image/png" href="https://static.wixstatic.com/media/d9ace9_95bbe3f5ff4b4aab9314a8d08804344e~mv2.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  
  <style>
    :root {
      --bg: #091B1E;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.1);
      --muted: #a0acae;
      --text: #ffffff;
      --accent: #2299dd;
      --danger: #e50914;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* HEADER */
    header {
      padding: 16px 40px;
      background: rgba(9, 27, 30, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo-container { display: flex; align-items: center; }
    .logo-image { height: 32px; width: auto; display: block; }

    header .nav-btns { display: flex; gap: 12px; }

    header button {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header button:hover { 
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.3);
    }

    header button.logout-btn {
      background: transparent;
      border-color: rgba(229, 9, 20, 0.4);
      color: #ff5555;
    }
    
    header button.logout-btn:hover {
      background: rgba(229, 9, 20, 0.15);
      border-color: var(--danger);
      color: white;
    }

    /* MAIN CONTAINER */
    .container {
      max-width: 850px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 20px;
      flex: 1;
    }

    /* SEKSJONER */
    .content h2 {
      margin: 24px 0 14px;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.3px;
    }

    .content h2:first-child { margin-top: 0; }
    .content h2 i { color: var(--muted); font-size: 16px; }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 0 20px;
      border: 1px solid var(--border);
      margin-bottom: 30px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 0;
      border-bottom: 1px solid var(--border);
      gap: 15px;
    }

    .row:last-child { border-bottom: none; }

    .info-block { flex: 1; }

    .label {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .profile-display-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-avatar-inline {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .value { font-size: 15px; font-weight: 500; }

    .row button.edit-trigger {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.2s, border-color 0.2s;
      white-space: nowrap;
    }

    .row button.edit-trigger:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .hidden { display: none !important; }

    /* INLINE ENDRING AV NAVN OG PASSORD */
    .edit-box {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      width: 100%;
    }

    .edit-box input {
      flex: 1;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: white;
      font-size: 14px;
      outline: none;
    }

    .edit-box input:focus { border-color: rgba(255, 255, 255, 0.4); }

    .edit-box button {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-save { background: white; color: black; }
    .btn-cancel { background: rgba(255,255,255,0.1); color: white; }

    /* SLETT PROFIL */
    .delete-container {
      margin-top: 10px;
      text-align: right;
    }

    button.delete-btn {
      background: transparent;
      border: 1px solid rgba(229, 9, 20, 0.3);
      color: #ff6666;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    button.delete-btn:hover {
      background: rgba(229, 9, 20, 0.15);
      border-color: var(--danger);
      color: white;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 30px 20px;
      color: #666;
      font-size: 13px;
      margin-top: auto;
      text-align: center;
    }

    @media (max-width: 650px) {
      header { padding: 12px 20px; }
      .logo-image { height: 26px; }
      header button span { display: none; }
      
      .row { 
        flex-direction: column; 
        align-items: flex-start; 
        gap: 10px; 
      }
      
      .row button.edit-trigger { width: 100%; text-align: center; }
      .delete-container { text-align: center; }
      button.delete-btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <img src="https://static.wixstatic.com/media/d9ace9_081ea242211b45a2801873c3067e1205~mv2.png" alt="Watch Nordic Logo" class="logo-image">
    </div>
    <div class="nav-btns">
      <button id="navHovedsideBtn"><i class="fa-solid fa-house"></i> <span>Hovedside</span></button>
      <button class="logout-btn" id="navLoggUtBtn"><i class="fa-solid fa-right-from-bracket"></i> <span>Logg Ut</span></button>
    </div>
  </header>

  <div class="container">
    <section class="content">
      <h2><i class="fa-solid fa-user"></i> Kontoinformasjon</h2>
      <div class="card">
        <!-- PROFILNAVN & BILDE -->
        <div class="row">
          <div class="info-block">
            <div class="label">Profilnavn</div>
            <div class="profile-display-wrapper">
              <img id="profilAvatarView" class="profile-avatar-inline" src="https://static.wixstatic.com/media/fd2fb2_39376e4ee55b460ab7a3ebbfcf35fef7~mv2.png" alt="Profilbilde">
              <div class="value" id="navnView">Laster...</div>
            </div>
            <div id="editNavnBox" class="edit-box hidden">
              <input type="text" id="nyttNavnInput" placeholder="Nytt navn">
              <button class="btn-save" id="lagreNavnBtn">Lagre</button>
              <button class="btn-cancel" id="avbrytNavnBtn">Avbryt</button>
            </div>
          </div>
          <button class="edit-trigger" id="endreNavnKnapp">Endre</button>
        </div>

        <!-- PROFIL-PIN / PASSORD -->
        <div class="row">
          <div class="info-block">
            <div class="label">Profil-PIN (Passord)</div>
            <div class="value" id="pinView">Ingen PIN satt</div>
            <div id="editPinBox" class="edit-box hidden">
              <input type="password" id="nyPinInput" maxlength="4" pattern="[0-9]*" inputmode="numeric" placeholder="4 siffer (la stå tom for å fjerne)">
              <button class="btn-save" id="lagrePinBtn">Lagre</button>
              <button class="btn-cancel" id="avbrytPinBtn">Avbryt</button>
            </div>
          </div>
          <button class="edit-trigger" id="endrePinKnapp">Endre PIN</button>
        </div>
        
        <!-- E-POST -->
        <div class="row">
          <div class="info-block">
            <div class="label">E-postadresse (Konto)</div>
            <div class="value" id="epostView">Laster...</div>
          </div>
        </div>
      </div>

      <h2><i class="fa-solid fa-tv"></i> Enheter</h2>
      <div class="card">
        <div class="row">
          <div class="info-block">
            <div class="label">Aktiv økt</div>
            <div class="value">Nettleser (Norge)</div>
          </div>
          <button class="edit-trigger" id="loggutAlleBtn">Logg ut alle enheter</button>
        </div>
      </div>

      <div class="delete-container">
        <button class="delete-btn" id="sletteKnapp"><i class="fa-solid fa-trash-can"></i> Slett profil permanent</button>
      </div>
    </section>
  </div>

  <footer>© 2026 Watch Nordic Group AS. Alle rettigheter forbeholdt.</footer>

  <script type="module">
    import { auth, db } from "./firebase-oppsett.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
    import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

    const urlParams = new URLSearchParams(window.location.search);
    let aktivProfilIndex = parseInt(urlParams.get('index')) || 0;

    const navnView = document.getElementById("navnView");
    const profilAvatarView = document.getElementById("profilAvatarView");
    const pinView = document.getElementById("pinView");
    const epostView = document.getElementById("epostView");

    // Navn-endring elementer
    const endreNavnKnapp = document.getElementById("endreNavnKnapp");
    const editNavnBox = document.getElementById("editNavnBox");
    const nyttNavnInput = document.getElementById("nyttNavnInput");
    const lagreNavnBtn = document.getElementById("lagreNavnBtn");
    const avbrytNavnBtn = document.getElementById("avbrytNavnBtn");

    // PIN-endring elementer
    const endrePinKnapp = document.getElementById("endrePinKnapp");
    const editPinBox = document.getElementById("editPinBox");
    const nyPinInput = document.getElementById("nyPinInput");
    const lagrePinBtn = document.getElementById("lagrePinBtn");
    const avbrytPinBtn = document.getElementById("avbrytPinBtn");

    let profiler = [];
    let globalEpost = ""; 
    let docRef = null;

    const standardBilde = "https://static.wixstatic.com/media/fd2fb2_39376e4ee55b460ab7a3ebbfcf35fef7~mv2.png";

    // Lokal-caching
    const cachedProfiles = localStorage.getItem("watch_nordic_profiles_cache");
    const cachedEmail = localStorage.getItem("watch_nordic_email_cache");
    if (cachedProfiles && cachedEmail) {
      profiler = JSON.parse(cachedProfiles);
      globalEpost = cachedEmail;
      if(profiler[aktivProfilIndex]) byggProfilgrensesnitt();
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        docRef = doc(db, "users", user.uid);
        globalEpost = user.email || globalEpost;
        hentKontodata();
      } else {
        window.location.href = "index.html";
      }
    });

    document.getElementById("navHovedsideBtn").addEventListener("click", () => {
      window.location.href = `hvem-ser-på.html?index=${aktivProfilIndex}`;
    });

    document.getElementById("navLoggUtBtn").addEventListener("click", loggUt);
    document.getElementById("sletteKnapp").addEventListener("click", slettProfil);
    document.getElementById("loggutAlleBtn").addEventListener("click", () => {
      alert("Du er nå logget ut på alle andre enheter.");
    });

    // Endre Navn Logikk
    endreNavnKnapp.addEventListener("click", () => {
      nyttNavnInput.value = profiler[aktivProfilIndex].navn;
      editNavnBox.classList.remove("hidden");
      endreNavnKnapp.classList.add("hidden");
    });

    avbrytNavnBtn.addEventListener("click", () => {
      editNavnBox.classList.add("hidden");
      endreNavnKnapp.classList.remove("hidden");
    });

    lagreNavnBtn.addEventListener("click", async () => {
      const nyttNavn = nyttNavnInput.value.trim();
      if (nyttNavn && nyttNavn !== profiler[aktivProfilIndex].navn) {
        profiler[aktivProfilIndex].navn = nyttNavn;
        await oppdaterProfilData();
        byggProfilgrensesnitt();
      }
      editNavnBox.classList.add("hidden");
      endreNavnKnapp.classList.remove("hidden");
    });

    // Endre PIN Logikk
    endrePinKnapp.addEventListener("click", () => {
      nyPinInput.value = profiler[aktivProfilIndex].pin || "";
      editPinBox.classList.remove("hidden");
      endrePinKnapp.classList.add("hidden");
    });

    avbrytPinBtn.addEventListener("click", () => {
      editPinBox.classList.add("hidden");
      endrePinKnapp.classList.remove("hidden");
    });

    lagrePinBtn.addEventListener("click", async () => {
      const nyPin = nyPinInput.value.trim();

      if (nyPin === "") {
        delete profiler[aktivProfilIndex].pin;
      } else {
        if (!/^\d{4}$/.test(nyPin)) {
          alert("PIN-koden må bestå av nøyaktig 4 siffer (tall).");
          return;
        }
        profiler[aktivProfilIndex].pin = nyPin;
      }

      await oppdaterProfilData();
      byggProfilgrensesnitt();

      editPinBox.classList.add("hidden");
      endrePinKnapp.classList.remove("hidden");
    });

    async function hentKontodata() {
      try {
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          const data = docSnap.data();
          profiler = data.profiler || [];
          globalEpost = data.epost || globalEpost;
          lagreILokalStorage();
          byggProfilgrensesnitt();
        }
      } catch (e) { console.error("Feil ved henting av data:", e); }
    }

    function byggProfilgrensesnitt() {
      const gjeldendeProfil = profiler[aktivProfilIndex];
      if (!gjeldendeProfil) return;

      navnView.innerText = gjeldendeProfil.navn;
      epostView.innerText = globalEpost;

      // Profilbilde
      profilAvatarView.src = gjeldendeProfil.bilde || standardBilde;

      // PIN Status
      if (gjeldendeProfil.pin) {
        pinView.innerText = "•••• (PIN er aktivert)";
      } else {
        pinView.innerText = "Ingen PIN satt";
      }

      if (gjeldendeProfil.isKids) {
        endreNavnKnapp.classList.add("hidden");
      } else {
        endreNavnKnapp.classList.remove("hidden");
      }
    }

    async function slettProfil() {
      if (profiler.length <= 1) {
        alert("Du kan ikke slette den eneste profilen på kontoen.");
        return;
      }

      if (confirm(`Er du sikker på at du vil slette profilen "${profiler[aktivProfilIndex].navn}" permanent?`)) {
        profiler.splice(aktivProfilIndex, 1);
        await oppdaterProfilData();
        window.location.href = "hvem-ser-på.html?index=0";
      }
    }

    async function oppdaterProfilData() {
      await setDoc(docRef, { profiler: profiler }, { merge: true });
      lagreILokalStorage();
    }

    function lagreILokalStorage() {
      localStorage.setItem("watch_nordic_profiles_cache", JSON.stringify(profiler));
      localStorage.setItem("watch_nordic_email_cache", globalEpost);
    }

    async function loggUt() {
      localStorage.clear();
      await signOut(auth);
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
