<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Nordic – Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #141414;
            --card-bg: #1f1f1f;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --border-color: #333333;
            --primary: #e50914; /* Netflix rød */
            --primary-hover: #b20710;
            --danger: #e50914;
            --danger-hover: #b20710;
            --success: #46d369;
        }

        body { 
            font-family: "Netflix Sans", "Segoe UI", system-ui, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 30px; 
            line-height: 1.5;
        }

        .hidden { display: none !important; }

        .login-box, .admin-container { 
            max-width: 1100px; 
            margin: 30px auto; 
            background: var(--card-bg); 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border: 1px solid var(--border-color);
        }

        h1, h2, h3 { 
            color: var(--text-main); 
            font-weight: 600;
        }

        p { 
            color: var(--text-muted); 
            font-size: 14px; 
        }

        input, select, textarea { 
            width: 100%; 
            padding: 12px 14px; 
            margin: 8px 0 16px 0; 
            background: #2b2b2b; 
            border: 1px solid var(--border-color); 
            color: var(--text-main); 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 14px;
            transition: all 0.2s ease;
        }

        input:focus, select:focus, textarea:focus { 
            outline: none; 
            border-color: var(--primary); 
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.2);
            background: #333;
        }

        textarea { 
            resize: vertical; 
            height: 90px; 
        }

        label { 
            font-size: 13px; 
            color: var(--text-muted); 
            display: block; 
            margin-top: 12px; 
            font-weight: 600;
        }

        button { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            font-size: 14px; 
            font-weight: 600;
            border-radius: 6px; 
            cursor: pointer; 
            margin-right: 10px; 
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover { 
            background: var(--primary-hover); 
        }

        .back-btn { 
            background: #2b2b2b; 
            color: var(--text-main); 
            margin-bottom: 25px; 
            border: 1px solid var(--border-color);
        }
        .back-btn:hover { 
            background: #3a3a3a; 
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        th, td { 
            padding: 14px 16px; 
            text-align: left; 
            border-bottom: 1px solid var(--border-color); 
            font-size: 14px;
        }

        th { 
            background: #1a1a1a; 
            color: var(--text-muted); 
            font-weight: 600; 
        }

        tr:hover { background: #222; }
        tr:last-child td { border-bottom: none; }

        .action-btns button { 
            padding: 6px 12px; 
            font-size: 13px; 
            margin-right: 5px; 
        }

        .delete-btn { background: #dc3545; }
        .delete-btn:hover { background: #bb2d3b; }

        .nav-tabs { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 25px; 
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .nav-tabs button {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .nav-tabs button:hover, .nav-tabs button.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .form-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
        }

        .form-full { grid-column: span 2; }

        /* Sesong- og episodebygger boks */
        .builder-box {
            background: #181818;
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .app-notification {
            padding: 12px 18px;
            border-radius: 6px;
            margin: 15px 0;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }
        .app-notification.success { background: rgba(70, 211, 105, 0.15); color: var(--success); border: 1px solid var(--success); }
        .app-notification.error { background: rgba(229, 9, 20, 0.15); color: #ff6b6b; border: 1px solid var(--danger); }
    </style>
</head>
<body>

    <!-- 1. INNLOGGING FOR ANSATTE -->
    <div id="loginSection" class="login-box">
        <h2><i class="fas fa-lock"></i> Ansattpålogging</h2>
        <p>Logg inn med din ansatt-e-post og passord:</p>
        <input type="email" id="emailInput" placeholder="E-postadresse...">
        <input type="password" id="passwordInput" placeholder="Passord...">
        <button id="loginBtn"><i class="fas fa-sign-in-alt"></i> Logg inn</button>
        <div id="loginErrorMsg" class="app-notification error"></div>
    </div>

    <!-- 2. SELVE ADMIN-PANELET -->
    <div id="adminSection" class="admin-container hidden">
        <button class="back-btn" onclick="window.location.href='Hovedside.html'"><i class="fas fa-arrow-left"></i> Tilbake til Hovedside</button>
        <h1><i class="fas fa-play-circle" style="color: var(--primary);"></i> Watch Nordic – Admin Dashboard</h1>
        
        <div id="globalNotif" class="app-notification"></div>

        <div class="nav-tabs">
            <button id="tabBtnInnhold" class="active" onclick="byttTab('innhold')"><i class="fas fa-film"></i> Filmer & Serier</button>
            <button id="tabBtnHistorikk" onclick="byttTab('historikk')"><i class="fas fa-history"></i> Brukerhistorikk</button>
        </div>

        <!-- TAB 1: FILMER OG SERIER -->
        <div id="tabInnhold" class="tab-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Innholdsbibliotek</h2>
                <button onclick="visLeggTilSkjema()"><i class="fas fa-plus"></i> Legg til ny tittel</button>
            </div>

            <!-- SKJEMA FOR Å LEGGE TIL/REDIGERE -->
            <div id="redigeringsSkjema" class="hidden" style="background: #1a1a1a; padding: 30px; margin-bottom: 30px; border-radius: 10px; border: 1px solid var(--border-color);">
                <h3 id="skjemaTittel" style="margin-top:0;"><i class="fas fa-film"></i> Ny tittel</h3>
                
                <div class="form-grid">
                    <div>
                        <label>Tittel:</label>
                        <input type="text" id="inpTittel" placeholder="F.eks. Stranger Things" oninput="genererID()">
                    </div>
                    <div>
                        <label>Unik ID (Genereres automatisk):</label>
                        <input type="text" id="inpId" placeholder="stranger-things" readonly style="background: #222; color: #777;">
                    </div>

                    <div>
                        <label>Type innhold:</label>
                        <select id="inpType" onchange="byttInnholdsType()">
                            <option value="filmer">Film</option>
                            <option value="serier">Serie</option>
                        </select>
                    </div>
                    <div>
                        <label>Rating:</label>
                        <input type="text" id="inpRating" placeholder="4.8 / 98% Match">
                    </div>

                    <div class="form-full">
                        <label>Beskrivelse:</label>
                        <textarea id="inpBeskrivelse" placeholder="Kort handlingsreferat..."></textarea>
                    </div>

                    <div>
                        <label>Bakgrunn URL (Desktop):</label>
                        <input type="text" id="inpBakgrunn" placeholder="https://...">
                    </div>
                    <div>
                        <label>Poster / Miniatyrbilde URL:</label>
                        <input type="text" id="inpPoster" placeholder="https://...">
                    </div>

                    <div>
                        <label>Logo URL (Tekstbilde):</label>
                        <input type="text" id="inpLogo" placeholder="https://...">
                    </div>
                    <div>
                        <label>Trailer URL:</label>
                        <input type="text" id="inpTrailer" placeholder="https://...">
                    </div>

                    <div>
                        <label>Metadata (År, Aldersgrense, Sjanger):</label>
                        <input type="text" id="inpMetadata" placeholder="2026, 12 år, Sci-Fi, Action">
                    </div>
                    <div>
                        <label id="lblSkaperRegissor">Regissør / Skapere:</label>
                        <input type="text" id="inpSkaperRegissor" placeholder="Navn på skaper">
                    </div>

                    <!-- FELT FOR FILM -->
                    <div id="filmSpesifikkeFelt" class="form-full form-grid" style="grid-column: span 2; margin:0; padding:0;">
                        <div>
                            <label>Video URL (.mp4):</label>
                            <input type="text" id="inpVideoUrl" placeholder="https://...">
                        </div>
                        <div>
                            <label>Undertekst URL (.vtt):</label>
                            <input type="text" id="inpSubtitleUrl" placeholder="https://...">
                        </div>
                    </div>

                    <!-- AUTOMATISK SERIE- OG EPISODEBYGGER (ERSTATTER ROTETE JSON) -->
                    <div id="serieSpesifikkeFelt" class="form-full hidden">
                        <label style="font-size:15px; color:var(--text-main);">Sesonger og Episoder:</label>
                        <div class="builder-box">
                            <div id="sesongContainer"></div>
                            <button type="button" onclick="leggTilSesong()" style="background: #2b2b2b; border:1px solid var(--border-color); margin-top: 10px;"><i class="fas fa-plus"></i> Legg til ny sesong</button>
                        </div>
                    </div>
                </div>

                <div style="margin-top: 25px;">
                    <button onclick="lagreInnhold()"><i class="fas fa-save"></i> Lagre tittel</button>
                    <button style="background:#333;" onclick="lukkSkjema()"><i class="fas fa-times"></i> Avbryt</button>
                </div>
            </div>

            <!-- Søkefelt for bibliotek -->
            <input type="text" id="sokFelt" placeholder="Søk i biblioteket..." oninput="filterTabell()" style="max-width: 300px; margin-bottom: 15px;">

            <table>
                <thead>
                    <tr>
                        <th>Type</th>
                        <th>ID</th>
                        <th>Tittel</th>
                        <th>Handlinger</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                    <!-- Fylles dynamisk -->
                </tbody>
            </table>
        </div>

        <!-- TAB 2: HISTORIKK -->
        <div id="tabHistorikk" class="tab-content hidden">
            <h2><i class="fas fa-stream"></i> Brukeraktivitet & Avspillingshistorikk</h2>
            <table>
                <thead>
                    <tr>
                        <th>Bruker / Profil</th>
                        <th>Aktivitet / Tittel</th>
                        <th>Status</th>
                        <th>Sist oppdatert</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    <!-- Fylles dynamisk -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- FIREBASE LOGIKK -->
    <script type="module">
        import { db, auth } from "./firebase-oppsett.js";
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
        import { collection, getDocs, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

        function visMelding(tekst, type = "success") {
            const notif = document.getElementById("globalNotif");
            notif.className = `app-notification ${type}`;
            notif.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i> ${tekst}`;
            notif.style.display = "block";
            setTimeout(() => { notif.style.display = "none"; }, 4000);
        }

        document.getElementById("loginBtn").addEventListener("click", async () => {
            const email = document.getElementById("emailInput").value.trim();
            const password = document.getElementById("passwordInput").value;
            const errorMsg = document.getElementById("loginErrorMsg");
            errorMsg.style.display = "none";

            if (!email || !password) {
                errorMsg.textContent = "Vennligst fyll ut e-post og passord.";
                errorMsg.style.display = "block";
                return;
            }

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                const ansattSnap = await getDoc(doc(db, "ansatte", user.uid));

                if (ansattSnap.exists()) {
                    document.getElementById("loginSection").classList.add("hidden");
                    document.getElementById("adminSection").classList.remove("hidden");
                    lastInnAltData();
                } else {
                    errorMsg.textContent = "Ingen ansatt-tilgang funnet.";
                    errorMsg.style.display = "block";
                }
            } catch (err) {
                errorMsg.textContent = "Feil ved innlogging.";
                errorMsg.style.display = "block";
            }
        });

        window.byttTab = function(tab) {
            if (tab === 'innhold') {
                document.getElementById("tabInnhold").classList.remove("hidden");
                document.getElementById("tabHistorikk").classList.add("hidden");
                document.getElementById("tabBtnInnhold").classList.add("active");
                document.getElementById("tabBtnHistorikk").classList.remove("active");
            } else {
                document.getElementById("tabInnhold").classList.add("hidden");
                document.getElementById("tabHistorikk").classList.remove("hidden");
                document.getElementById("tabBtnInnhold").classList.remove("active");
                document.getElementById("tabBtnHistorikk").classList.add("active");
                lastInnHistorikk();
            }
        }

        window.byttInnholdsType = function() {
            const type = document.getElementById("inpType").value;
            if (type === "serier") {
                document.getElementById("filmSpesifikkeFelt").classList.add("hidden");
                document.getElementById("serieSpesifikkeFelt").classList.remove("hidden");
                document.getElementById("lblSkaperRegissor").textContent = "Skapere:";
            } else {
                document.getElementById("filmSpesifikkeFelt").classList.remove("hidden");
                document.getElementById("serieSpesifikkeFelt").classList.add("hidden");
                document.getElementById("lblSkaperRegissor").textContent = "Regissør:";
            }
        }

        window.genererID = function() {
            const tittel = document.getElementById("inpTittel").value;
            const id = tittel.toLowerCase().replace(/[^a-z0-9]/g, "-").replace(/-+/g, "-");
            document.getElementById("inpId").value = id;
        }

        // Automatisk sesong- og episodebygger funksjoner
        window.leggTilSesong = function() {
            const container = document.getElementById("sesongContainer");
            const sesongNr = container.children.length + 1;
            
            const div = document.createElement("div");
            div.className = "sesong-item";
            div.style.cssText = "background: #111; padding: 15px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #333;";
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <strong>Sesong ${sesongNr}</strong>
                    <button type="button" onclick="this.parentElement.parentElement.remove()" style="background:#dc3545; padding:4px 8px; font-size:11px;">Fjern sesong</button>
                </div>
                <input type="text" class="sesong-beskrivelse" placeholder="Beskrivelse for sesongen..." style="margin-top:10px;">
                <div class="episoder-container" style="margin-top:10px;"></div>
                <button type="button" onclick="leggTilEpisodTilSesong(this)" style="background:#2b2b2b; font-size:12px; margin-top:5px;"><i class="fas fa-plus"></i> Legg til episode</button>
            `;
            container.appendChild(div);
        }

        window.leggTilEpisodTilSesong = function(btn) {
            const epiContainer = btn.previousElementSibling;
            const epiNr = epiContainer.children.length + 1;

            const div = document.createElement("div");
            div.className = "episode-item";
            div.style.cssText = "background: #181818; padding: 10px; border-radius: 4px; margin-top: 8px; border: 1px solid #282828;";
            div.innerHTML = `
                <div style="display:flex; gap:10px;">
                    <input type="text" class="epi-tittel" placeholder="Episode ${epiNr} tittel" style="margin:0;">
                    <input type="text" class="epi-video" placeholder="Video URL (.mp4)" style="margin:0;">
                </div>
                <input type="text" class="epi-thumb" placeholder="Thumbnail URL" style="margin:5px 0 0 0;">
            `;
            epiContainer.appendChild(div);
        }

        window.lastInnAltData = async function() {
            const tbody = document.getElementById("dataTableBody");
            tbody.innerHTML = "";
            try {
                const filmSnap = await getDocs(collection(db, "filmer"));
                filmSnap.forEach((d) => leggTilTabellRad("Film", "filmer", d.id, d.data().tittel || d.id));

                const serieSnap = await getDocs(collection(db, "serier"));
                serieSnap.forEach((d) => leggTilTabellRad("Serie", "serier", d.id, d.data().tittel || d.id));
            } catch (err) {
                console.error("Feil ved lasting:", err);
            }
        }

        function leggTilTabellRad(typeVisning, samling, id, tittel) {
            const tbody = document.getElementById("dataTableBody");
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${typeVisning}</td>
                <td>${id}</td>
                <td>${tittel}</td>
                <td class="action-btns">
                    <button class="delete-btn btn-slett" data-samling="${samling}" data-id="${id}"><i class="fas fa-trash"></i> Slett</button>
                </td>
            `;
            tr.querySelector(".btn-slett").addEventListener("click", async function() {
                try {
                    await deleteDoc(doc(db, this.getAttribute("data-samling"), this.getAttribute("data-id")));
                    visMelding("Tittelen ble slettet.", "success");
                    lastInnAltData();
                } catch (err) {
                    visMelding("Feil ved sletting.", "error");
                }
            });
            tbody.appendChild(tr);
        }

        window.visLeggTilSkjema = function() {
            document.getElementById("redigeringsSkjema").classList.remove("hidden");
            document.querySelectorAll("#redigeringsSkjema input, #redigeringsSkjema textarea").forEach(el => {
                if(el.id !== 'inpType') el.value = "";
            });
            document.getElementById("sesongContainer").innerHTML = "";
            byttInnholdsType();
        }

        window.lukkSkjema = function() {
            document.getElementById("redigeringsSkjema").classList.add("hidden");
        }

        window.lagreInnhold = async function() {
            const id = document.getElementById("inpId").value.trim();
            const samling = document.getElementById("inpType").value;
            const tittel = document.getElementById("inpTittel").value.trim();

            if (!id || !tittel) {
                visMelding("Tittel må fylles ut!", "error");
                return;
            }

            let obj = {
                tittel: tittel,
                rating: document.getElementById("inpRating").value.trim(),
                bakgrunn: document.getElementById("inpBakgrunn").value.trim(),
                poster: document.getElementById("inpPoster").value.trim(),
                logo: document.getElementById("inpLogo").value.trim(),
                trailer: document.getElementById("inpTrailer").value.trim(),
                beskrivelse: document.getElementById("inpBeskrivelse").value.trim(),
                metadata: document.getElementById("inpMetadata").value.split(",").map(s => s.trim()),
                publishDate: new Date().toISOString()
            };

            if (samling === "filmer") {
                obj.regissor = document.getElementById("inpSkaperRegissor").value.trim();
                obj.videoUrl = document.getElementById("inpVideoUrl").value.trim();
                obj.subtitleUrl = document.getElementById("inpSubtitleUrl").value.trim();
                obj.watchUrl = `film-mal.html?id=${id}`;
            } else {
                obj.skapere = document.getElementById("inpSkaperRegissor").value.trim();
                obj.sesonger = {};
                
                const sesongDivs = document.querySelectorAll("#sesongContainer .sesong-item");
                sesongDivs.forEach((sesDiv, sIndex) => {
                    const sNummer = sIndex + 1;
                    const sBesk = sesDiv.querySelector(".sesong-beskrivelse").value;
                    const episoder = {};

                    sesDiv.querySelectorAll(".episode-item").forEach((epiDiv, eIndex) => {
                        const eNummer = eIndex + 1;
                        episoder[eNummer] = {
                            episodeNummer: eNummer,
                            tittel: epiDiv.querySelector(".epi-tittel").value,
                            videoUrl: epiDiv.querySelector(".epi-video").value,
                            thumbnail: epiDiv.querySelector(".epi-thumb").value
                        };
                    });

                    obj.sesonger[sNummer] = {
                        sesongNummer: sNummer,
                        beskrivelse: sBesk,
                        episoder: episoder
                    };
                });
            }

            try {
                await setDoc(doc(db, samling, id), obj);
                visMelding(`"${tittel}" ble lagret!`, "success");
                lukkSkjema();
                lastInnAltData();
            } catch (err) {
                visMelding("Feil ved lagring: " + err.message, "error");
            }
        }

        window.filterTabell = function() {
            const query = document.getElementById("sokFelt").value.toLowerCase();
            const rows = document.querySelectorAll("#dataTableBody tr");
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(query) ? "" : "none";
            });
        }

        async function lastInnHistorikk() {
            const historyBody = document.getElementById("historyTableBody");
            historyBody.innerHTML = "";
            try {
                const brukereSnap = await getDocs(collection(db, "users"));
                brukereSnap.forEach((userDoc) => {
                    const userData = userDoc.data();
                    if (userData.profiler && Array.isArray(userData.profiler)) {
                        userData.profiler.forEach(profil => {
                            if (profil.fremdrift) {
                                Object.entries(profil.fremdrift).forEach(([filmId, info]) => {
                                    const tr = document.createElement("tr");
                                    tr.innerHTML = `
                                        <td>${profil.navn || 'Profil'}</td>
                                        <td>${info.tittel || filmId}</td>
                                        <td>${info.status || 'påbegynt'} (${info.percent || 0}%)</td>
                                        <td>${new Date(info.sistOppdatert).toLocaleString('no-NO') || '-'}</td>
                                    `;
                                    historyBody.appendChild(tr);
                                });
                            }
                        });
                    }
                });
            } catch (err) {
                console.error("Feil ved historikk:", err);
            }
        }
    </script>
</body>
</html>
