<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Importerer data til Firebase</title>
</head>
<body>
    <h1 style="font-family: sans-serif;">Laster opp film- og seriedata til Watch Nordic... 🚀</h1>
    <p style="font-family: sans-serif;">Hold denne siden åpen til du får en beskjed på skjermen.</p>

    <!-- Vi laster inn filmdataene og seriedataene dine (Med stor F og stor S!) -->
    <script src="Filmdata.js"></script>
    <script src="Seriedata.js"></script>

    <!-- Kobler til Firebase ved å bruke ditt eget firebase-oppsett.js -->
    <script type="module">
        import { db } from "./firebase-oppsett.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

        async function startOpplasting() {
            console.log("🚀 Starter automatisk opplasting til Firestore...");

            try {
                // 1. Laster opp filmene hvis variabelen 'filmer' (eller 'Filmdata') finnes
                const filmKilde = typeof filmer !== 'undefined' ? filmer : (typeof Filmdata !== 'undefined' ? Filmdata : null);
                
                if (filmKilde) {
                    for (const [filmId, filmData] of Object.entries(filmKilde)) {
                        await setDoc(doc(db, "filmer", filmId), filmData);
                        console.log("✅ Film lastet opp:", filmData.tittel || filmId);
                    }
                } else {
                    console.log("⚠️ Fant ingen filmvariabel i Filmdata.js");
                }

                // 2. Laster opp seriene hvis variabelen 'serier' (eller 'Seriedata') finnes
                const serieKilde = typeof serier !== 'undefined' ? serier : (typeof Seriedata !== 'undefined' ? Seriedata : null);
                
                if (serieKilde) {
                    for (const [serieId, serieData] of Object.entries(serieKilde)) {
                        await setDoc(doc(db, "serier", serieId), serieData);
                        console.log("✅ Serie lastet opp:", serieData.tittel || serieId);
                    }
                } else {
                    console.log("⚠️ Fant ingen serievariabel i Seriedata.js");
                }

                console.log("🎉 FERDIG! Alt ligger nå trygt i Firebase!");
                alert("Hurra! Alle filmene og seriene dine er nå lastet opp til Firebase Firestore!");

            } catch (feil) {
                console.error("❌ Feil under opplasting:", feil);
                alert("Det oppsto en feil! Sjekk konsollen (F12) for detaljer.");
            }
        }

        startOpplasting();
    </script>
</body>
</html>
