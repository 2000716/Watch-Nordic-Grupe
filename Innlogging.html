<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Innlogging / Registrering | Watch Nordic™</title>
  
  <link rel="icon" type="image/png" href="https://static.wixstatic.com/media/d9ace9_95bbe3f5ff4b4aab9314a8d08804344e~mv2.png" />

  <style>
    /* ================= RESET & BASE ================= */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body {
      background-color: #091B1E;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #FFFFFF;
      overflow-x: hidden;
      position: relative;
    }

    /* ================= SKJEMA CONTAINER (NETFLIX STIL) ================= */
    .container {
      background: rgba(12, 34, 38, 0.85);
      padding: 50px 48px;
      border-radius: 12px;
      border: none;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
      max-width: 440px;
      width: 100%;
      text-align: center;
      z-index: 10;
      margin: 20px;
      transition: all 0.3s ease;
    }

    /* Watch Logo */
    .site-logo {
      height: 42px;
      width: auto;
      object-fit: contain;
      margin-bottom: 24px;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
    }

    h2 { 
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px; 
      color: #ffffff;
    }
    
    p.subtitle {
      font-size: 14px;
      color: #93A6A8;
      margin-bottom: 28px;
      line-height: 1.4;
    }

    .input-group {
      position: relative;
      margin-bottom: 18px;
      text-align: left;
    }

    label { 
      display: block; 
      margin-bottom: 8px; 
      font-size: 12px; 
      font-weight: 700;
      color: #B2C4C6;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
    }

    input { 
      width: 100%; 
      padding: 14px 16px; 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      border-radius: 8px; 
      background: rgba(6, 18, 20, 0.7);
      color: #FFFFFF;
      font-size: 15px;
      transition: all 0.2s ease;
    }

    input::placeholder {
      color: #4A6366;
    }

    input:focus {
      outline: none;
      border-color: #00FFCC;
      background: rgba(6, 18, 20, 0.95);
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
    }

    button.submit-btn {
      width: 100%; 
      padding: 16px; 
      background: linear-gradient(135deg, #00FFCC 0%, #00D6AB 100%);
      color: #041012; 
      border: none; 
      border-radius: 8px;
      cursor: pointer; 
      font-size: 16px; 
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-top: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 6px 16px rgba(0, 255, 204, 0.2);
    }
    
    button.submit-btn:hover { 
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(0, 255, 204, 0.35);
      background: linear-gradient(135deg, #1AFFD1 0%, #00E6B8 100%);
    }

    button.submit-btn:active {
      transform: translateY(0);
    }

    .error { 
      color: #FF5252; 
      margin-top: 14px; 
      min-height: 20px; 
      font-size: 13px;
      font-weight: 600;
    }

    .toggle-text, .forgot-text { 
      margin-top: 20px; 
      font-size: 14px; 
      color: #93A6A8;
    }
    
    .forgot-text {
      margin-top: 10px;
      text-align: right;
    }

    .toggle-text a, .forgot-text a { 
      color: #00FFCC; 
      cursor: pointer; 
      text-decoration: none; 
      font-weight: 700;
      transition: color 0.2s ease;
    }

    .toggle-text a:hover, .forgot-text a:hover {
      color: #66FFE0;
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .container {
        padding: 36px 24px;
        margin: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Watch logo -->
    <img src="https://static.wixstatic.com/media/d9ace9_081ea242211b45a2801873c3067e1205~mv2.png" alt="WATCH Logo" class="site-logo">
    
    <h2 id="formTitle">Logg inn</h2>
    <p class="subtitle" id="formSubtitle">Vennligst oppgi dine detaljer for å fortsette</p>

    <form id="authForm">
      <div class="input-group" id="navnGruppe" style="display: none;">
        <label for="navn">Navn</label>
        <div class="input-wrapper">
          <input type="text" id="navn" placeholder="Ditt fulle navn" autocomplete="name" />
        </div>
      </div>

      <div class="input-group">
        <label for="epost">E-postadresse</label>
        <div class="input-wrapper">
          <input type="email" id="epost" placeholder="navn@domene.no" autocomplete="email" required />
        </div>
      </div>

      <div class="input-group">
        <label for="passord">Passord</label>
        <div class="input-wrapper">
          <input type="password" id="passord" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <div class="forgot-text" id="forgotContainer">
          <a href="Passordfeil.html">Glemt passord?</a>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitKnapp">Fortsett</button>
      <div class="error" id="feilmelding"></div>
    </form>

    <div class="toggle-text" id="toggleText">
      Er du ikke medlem? <a onclick="visRegistrering()">Registrer deg</a>
    </div>
  </div>

  <script type="module">
    // 1. Hent den ferdig oppsatte databasen og autentiseringen fra fellesfilen din
    import { auth, db } from "./firebase-oppsett.js";

    // 2. Hent funksjonene denne siden trenger fra de offisielle CDN-lenkene (v12.15.0)
    import { signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
    import { doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

    let registreringsmodus = false;

    // ================= SKJEMABEHANDLING MED FIREBASE =================
    document.getElementById("authForm").addEventListener("submit", async function(event) {
      event.preventDefault(); 
      
      const epost = document.getElementById("epost").value.trim().toLowerCase();
      const passord = document.getElementById("passord").value.trim();
      const navn = document.getElementById("navn").value.trim() || "Hovedprofil";
      const feilmelding = document.getElementById("feilmelding");
      
      feilmelding.textContent = "Laster..."; 

      try {
        if (registreringsmodus) {
          // 1. Opprett bruker i Firebase Auth
          const userCredential = await createUserWithEmailAndPassword(auth, epost, passord);
          const user = userCredential.user;

          const standardProfil = [
            {
              navn: navn,
              bilde: "https://static.wixstatic.com/media/fd2fb2_39376e4ee55b460ab7a3ebbfcf35fef7~mv2.png",
              isKids: false,
              maksAldersgrense: "12"
            }
          ];

          // 2. Opprett brukerdokumentet i Firestore med navn med en gang!
          await setDoc(doc(db, "users", user.uid), {
            epost: epost,
            profiler: standardProfil
          });

          // MELLOMLAGRING: Pre-lagre cachen lokalt slik at Hovedside slipper å hente fra Firestore!
          localStorage.setItem("watch_nordic_profiles_cache", JSON.stringify(standardProfil));
          localStorage.setItem("watch_nordic_email_cache", epost);

          // Send videre til Hovedside med profilindeks 0
          window.location.href = "Hovedside.html?index=0";
        } else {
          // Firebase Innlogging
          const userCredential = await signInWithEmailAndPassword(auth, epost, passord);
          const user = userCredential.user;

          // MELLOMLAGRING: Last ned og cache profilene NÅ, så neste side slipper databasekall
          const docRef = doc(db, "users", user.uid);
          const docSnap = await getDoc(docRef);

          if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.profiler) localStorage.setItem("watch_nordic_profiles_cache", JSON.stringify(data.profiler));
            localStorage.setItem("watch_nordic_email_cache", epost);
          }

          window.location.href = "Hovedside.html?index=0";
        }
      } catch (error) {
        if (error.code === 'auth/email-already-in-use') {
          feilmelding.textContent = "E-posten er allerede registrert.";
        } else if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
          feilmelding.textContent = "Feil e-post eller passord.";
        } else if (error.code === 'auth/weak-password') {
          feilmelding.textContent = "Passordet er for svakt (minst 6 tegn).";
        } else {
          feilmelding.textContent = "En feil oppstod. Prøv igjen.";
          console.error(error); 
        }
      }
    });

    // ================= GRENSESNITTBYTTE =================
    function visRegistrering() {
      registreringsmodus = true;
      document.getElementById("formTitle").textContent = "Registrer deg";
      document.getElementById("formSubtitle").textContent = "Opprett en konto for å starte streamingen";
      document.getElementById("submitKnapp").textContent = "Registrer";
      document.getElementById("forgotContainer").style.display = "none";
      document.getElementById("toggleText").innerHTML =
        'Allerede medlem? <a onclick="visInnlogging()">Logg inn</a>';
      document.getElementById("navnGruppe").style.display = "block";
      document.getElementById("feilmelding").textContent = "";
      document.getElementById("passord").setAttribute("autocomplete", "new-password");
    }

    function visInnlogging() {
      registreringsmodus = false;
      document.getElementById("formTitle").textContent = "Logg inn";
      document.getElementById("formSubtitle").textContent = "Vennligst oppgi dine detaljer for å fortsette";
      document.getElementById("submitKnapp").textContent = "Fortsett";
      document.getElementById("forgotContainer").style.display = "block";
      document.getElementById("toggleText").innerHTML =
        'Er du ikke medlem? <a onclick="visRegistrering()">Registrer deg</a>';
      document.getElementById("navnGruppe").style.display = "none";
      document.getElementById("feilmelding").textContent = "";
      document.getElementById("passord").setAttribute("autocomplete", "current-password");
    }

    window.visRegistrering = visRegistrering;
    window.visInnlogging = visInnlogging;
  </script>
</body>
</html>
