<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Innlogging / Registrering | Watch Nordic™</title>
  
  <link rel="icon" type="image/png" href="https://static.wixstatic.com/media/d9ace9_95bbe3f5ff4b4aab9314a8d08804344e~mv2.png" />

  <style>
    /* ================= RESET & BASE ================= */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body {
      background-color: #091B1E;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      color: #FFFFFF;
      overflow-x: hidden;
    }

    /* ================= TOPPLINJE / LOGO ================= */
    .header {
      padding: 32px 48px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .logo-link {
      display: inline-block;
      cursor: pointer;
      line-height: 0;
    }

    .site-logo {
      height: 46px;
      width: auto;
      object-fit: contain;
      transition: opacity 0.2s ease;
    }

    .logo-link:hover .site-logo {
      opacity: 0.85;
    }

    /* ================= HOVEDINNHOLD / SKJEMA ================= */
    .main-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: transparent;
      max-width: 440px; /* Gjort bredere for PC */
      width: 100%;
      text-align: left;
    }

    h2 { 
      font-size: 36px; /* Større tittel for PC */
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 10px; 
      color: #ffffff;
    }
    
    p.subtitle {
      font-size: 16px; /* Større undertittel for PC */
      color: #93A6A8;
      margin-bottom: 32px;
      line-height: 1.4;
    }

    /* ================= ANIMASJON FOR STEG ================= */
    .step-content {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .step-content.animating-out {
      opacity: 0;
      transform: translateY(-10px);
    }

    .step-content.animating-in {
      opacity: 0;
      transform: translateY(10px);
    }

    /* Viser valgt e-post i steg 2 */
    .selected-email-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 15px;
      color: #FFFFFF;
      margin-bottom: 24px;
    }

    .selected-email-badge button {
      background: none;
      border: none;
      color: #00FFCC;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }

    .selected-email-badge button:hover {
      text-decoration: underline;
    }

    .input-group {
      margin-bottom: 22px;
    }

    label { 
      display: block; 
      margin-bottom: 8px; 
      font-size: 13px; 
      font-weight: 700;
      color: #B2C4C6;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    input { 
      width: 100%; 
      padding: 18px 20px; /* Større skrivefelt (mer polstret) */
      border: 1px solid rgba(255, 255, 255, 0.15); 
      border-radius: 8px; 
      background: rgba(6, 18, 20, 0.8);
      color: #FFFFFF;
      font-size: 17px; /* Større tekst inni feltet for PC */
      transition: border-color 0.2s ease;
    }

    input::placeholder {
      color: #4A6366;
    }

    input:focus {
      outline: none;
      border-color: #00FFCC;
      background: #061214;
    }

    button.submit-btn {
      width: 100%; 
      padding: 18px; /* Større knapp */
      background: #00FFCC;
      color: #041012; 
      border: none; 
      border-radius: 8px;
      cursor: pointer; 
      font-size: 17px; /* Større tekst på knapp */
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-top: 10px;
      transition: background-color 0.2s ease;
    }
    
    button.submit-btn:hover { 
      background: #00E6B8;
    }

    .error { 
      color: #FF5252; 
      margin-top: 14px; 
      min-height: 20px; 
      font-size: 14px;
      font-weight: 600;
    }

    .toggle-text, .forgot-text { 
      margin-top: 26px; 
      font-size: 15px; /* Større buntekst */
      color: #93A6A8;
    }
    
    .forgot-text {
      margin-top: 10px;
      text-align: right;
      font-size: 14px;
    }

    .toggle-text a, .forgot-text a { 
      color: #00FFCC; 
      cursor: pointer; 
      text-decoration: none; 
      font-weight: 700;
    }

    .toggle-text a:hover, .forgot-text a:hover {
      text-decoration: underline;
    }

    /* ================= MOBILANPASSNING (RESPONSIV DESIGN) ================= */
    @media (max-width: 600px) {
      .header {
        padding: 24px 20px;
        justify-content: flex-start;
      }

      .site-logo {
        height: 36px;
      }

      .main-content {
        padding: 10px 20px 40px 20px;
      }

      .container {
        max-width: 100%;
      }

      h2 {
        font-size: 28px;
      }

      p.subtitle {
        font-size: 14px;
        margin-bottom: 24px;
      }

      input {
        padding: 14px 16px;
        font-size: 16px; /* Holder 16px på mobil for å unngå auto-zoom på iOS */
      }

      button.submit-btn {
        padding: 15px;
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- WATCH LOGO ØVERST TIL VENSTRE (KLIKKBAR TIL INDEX.HTML) -->
  <header class="header">
    <a href="index.html" class="logo-link">
      <img src="https://static.wixstatic.com/media/d9ace9_081ea242211b45a2801873c3067e1205~mv2.png" alt="WATCH Logo" class="site-logo">
    </a>
  </header>

  <!-- SKJEMA-OMRÅDE -->
  <main class="main-content">
    <div class="container">
      <h2 id="formTitle">Logg inn</h2>
      <p class="subtitle" id="formSubtitle">Skriv inn e-postadressen din for å fortsette</p>

      <form id="authForm">
        
        <!-- TRINN 1: SKRIV INN E-POST -->
        <div id="steg1" class="step-content">
          <div class="input-group">
            <label for="epost">E-postadresse</label>
            <input type="email" id="epost" placeholder="navn@domene.no" autocomplete="email" required />
          </div>
          <button type="button" class="submit-btn" id="nesteKnapp">Neste</button>
        </div>

        <!-- TRINN 2: SKRIV INN PASSORD -->
        <div id="steg2" class="step-content" style="display: none;">
          
          <div class="selected-email-badge">
            <span id="visEpostTekst"></span>
            <button type="button" onclick="gaaTilSteg1()">Endre</button>
          </div>

          <div class="input-group" id="navnGruppe" style="display: none;">
            <label for="navn">Navn</label>
            <input type="text" id="navn" placeholder="Ditt fulle navn" autocomplete="name" />
          </div>

          <div class="input-group">
            <label for="passord">Passord</label>
            <input type="password" id="passord" placeholder="••••••••" autocomplete="current-password" />
            <div class="forgot-text" id="forgotContainer">
              <a href="Passordfeil.html">Glemt passord?</a>
            </div>
          </div>

          <button type="submit" class="submit-btn" id="submitKnapp">Logg inn</button>
        </div>

        <div class="error" id="feilmelding"></div>
      </form>

      <div class="toggle-text" id="toggleText">
        Er du ikke medlem? <a onclick="visRegistrering()">Registrer deg</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { auth, db } from "./firebase-oppsett.js";
    import { signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
    import { doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

    let registreringsmodus = false;
    let naavaarendeSteg = 1;

    const epostInput = document.getElementById("epost");
    const passordInput = document.getElementById("passord");
    const feilmelding = document.getElementById("feilmelding");

    // TRYKK PÅ NESTE (TRINN 1 -> TRINN 2)
    document.getElementById("nesteKnapp").addEventListener("click", validerOgGaVidere);

    // Enter-knapp i e-postfeltet utløser Steg 2
    epostInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        validerOgGaVidere();
      }
    });

    function validerOgGaVidere() {
      if (!epostInput.checkValidity() || !epostInput.value.trim()) {
        feilmelding.textContent = "Vennligst oppgi en gyldig e-postadresse.";
        return;
      }
      feilmelding.textContent = "";
      skiftStegMedAnimasjon(1, 2);
    }

    function gaaTilSteg1() {
      feilmelding.textContent = "";
      skiftStegMedAnimasjon(2, 1);
    }

    // Funksjon som styrer animasjonen mellom stegene
    function skiftStegMedAnimasjon(fraStegNr, tilStegNr) {
      const fraElement = document.getElementById(`steg${fraStegNr}`);
      const tilElement = document.getElementById(`steg${tilStegNr}`);

      fraElement.classList.add("animating-out");

      setTimeout(() => {
        fraElement.style.display = "none";
        fraElement.classList.remove("animating-out");

        tilElement.style.display = "block";
        tilElement.classList.add("animating-in");

        naavaarendeSteg = tilStegNr;
        if (tilStegNr === 2) {
          document.getElementById("visEpostTekst").textContent = epostInput.value.trim();
          passordInput.required = true;
          passordInput.focus();
          document.getElementById("formSubtitle").textContent = registreringsmodus 
            ? "Velg et passord for å opprette kontoen" 
            : "Skriv inn passordet ditt";
        } else {
          passordInput.required = false;
          epostInput.focus();
          document.getElementById("formSubtitle").textContent = registreringsmodus 
            ? "Skriv inn e-post for å opprette konto" 
            : "Skriv inn e-postadressen din for å fortsette";
        }

        requestAnimationFrame(() => {
          tilElement.classList.remove("animating-in");
        });

      }, 250);
    }

    // FIREBASE INNLOGGING / REGISTRERING
    document.getElementById("authForm").addEventListener("submit", async function(event) {
      event.preventDefault(); 
      
      if (naavaarendeSteg === 1) {
        validerOgGaVidere();
        return;
      }

      const epost = epostInput.value.trim().toLowerCase();
      const passord = passordInput.value.trim();
      const navn = document.getElementById("navn").value.trim() || "Hovedprofil";
      
      feilmelding.textContent = "Laster..."; 

      try {
        if (registreringsmodus) {
          const userCredential = await createUserWithEmailAndPassword(auth, epost, passord);
          const user = userCredential.user;

          const standardProfil = [
            {
              navn: navn,
              bilde: "https://static.wixstatic.com/media/fd2fb2_39376e4ee55b460ab7a3ebbfcf35fef7~mv2.png",
              isKids: false,
              maksAldersgrense: "12"
            }
          ];

          await setDoc(doc(db, "users", user.uid), {
            epost: epost,
            profiler: standardProfil
          });

          localStorage.setItem("watch_nordic_profiles_cache", JSON.stringify(standardProfil));
          localStorage.setItem("watch_nordic_email_cache", epost);

          window.location.href = "Hovedside.html?index=0";
        } else {
          const userCredential = await signInWithEmailAndPassword(auth, epost, passord);
          const user = userCredential.user;

          const docRef = doc(db, "users", user.uid);
          const docSnap = await getDoc(docRef);

          if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.profiler) localStorage.setItem("watch_nordic_profiles_cache", JSON.stringify(data.profiler));
            localStorage.setItem("watch_nordic_email_cache", epost);
          }

          window.location.href = "Hovedside.html?index=0";
        }
      } catch (error) {
        if (error.code === 'auth/email-already-in-use') {
          feilmelding.textContent = "E-posten er allerede registrert.";
        } else if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
          feilmelding.textContent = "Feil passord.";
        } else if (error.code === 'auth/weak-password') {
          feilmelding.textContent = "Passordet er for svakt (minst 6 tegn).";
        } else {
          feilmelding.textContent = "En feil oppstod. Prøv igjen.";
          console.error(error); 
        }
      }
    });

    // VEKSLE MELLOM REGISTRERING OG INNLOGGING
    function visRegistrering() {
      registreringsmodus = true;
      document.getElementById("formTitle").textContent = "Registrer deg";
      document.getElementById("submitKnapp").textContent = "Opprett konto";
      document.getElementById("forgotContainer").style.display = "none";
      document.getElementById("toggleText").innerHTML =
        'Allerede medlem? <a onclick="visInnlogging()">Logg inn</a>';
      document.getElementById("navnGruppe").style.display = "block";
      document.getElementById("feilmelding").textContent = "";
      passordInput.setAttribute("autocomplete", "new-password");

      if (naavaarendeSteg === 1) {
        document.getElementById("formSubtitle").textContent = "Skriv inn e-post for å opprette konto";
      } else {
        document.getElementById("formSubtitle").textContent = "Velg et passord for å opprette kontoen";
      }
    }

    function visInnlogging() {
      registreringsmodus = false;
      document.getElementById("formTitle").textContent = "Logg inn";
      document.getElementById("submitKnapp").textContent = "Logg inn";
      document.getElementById("forgotContainer").style.display = "block";
      document.getElementById("toggleText").innerHTML =
        'Er du ikke medlem? <a onclick="visRegistrering()">Registrer deg</a>';
      document.getElementById("navnGruppe").style.display = "none";
      document.getElementById("feilmelding").textContent = "";
      passordInput.setAttribute("autocomplete", "current-password");

      if (naavaarendeSteg === 1) {
        document.getElementById("formSubtitle").textContent = "Skriv inn e-postadressen din for å fortsette";
      } else {
        document.getElementById("formSubtitle").textContent = "Skriv inn passordet ditt";
      }
    }

    window.visRegistrering = visRegistrering;
    window.visInnlogging = visInnlogging;
    window.gaaTilSteg1 = gaaTilSteg1;
  </script>
</body>
</html>
