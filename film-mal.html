<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Filmvisning</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://static.wixstatic.com/media/fd2fb2_39376e4ee55b460ab7a3ebbfcf35fef7~mv2.png" />

  <!-- Skrifttyper og Ikoner -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

<style>
  /* ==========================================================================
     1. SYSTEM RESET, LAYOUT OG SPILLEMAL (ØVERST)
     ========================================================================== */
  
  * { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
    user-select: none;
    -webkit-user-select: none;
  }

  body { 
    background: #000; 
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    overflow: hidden; 
    width: 100vw;
    height: 100vh;
  }

  /* Skjuler musepekeren ved inaktivitet */
  body.no-cursor, 
  body.no-cursor * {
    cursor: none !important;
  }

  /* CONTAINER & VIDEOWRAPPER */
  .container { 
    position: relative; 
    width: 100vw; 
    height: 100vh; 
    overflow: hidden; 
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background 0.6s ease-in-out;
  }

  #videoWrapper {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    box-shadow: 0 0 0 rgba(0,0,0,0);
    transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    z-index: 2;
  }

  #videoWrapper.video-fullscreen {
    position: absolute !important;
    width: 100% !important;
    height: 100% !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    border: none !important;
    border-radius: 0 !important;
    z-index: 2 !important;
    transform: none !important;
  }

  video {
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    background: #000;
  }

  /* UNDERTEKSTER */
  video::cue {
    font-family: 'Inter', sans-serif;
    font-size: 24px !important;
    font-weight: 400;
    color: #ffffff;
    background: transparent !important;
    text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.8), -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    letter-spacing: 0.5px;
    line-height: 1.4;
  }

  .subtitle-overlay {
    position: absolute;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    text-align: center;
    pointer-events: none;
    z-index: 5;
    font-family: 'Inter', sans-serif;
    font-size: 26px;
    font-weight: 500;
    color: #FFFFFF;
    text-shadow: 0px 2px 6px rgba(0,0,0,1), -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
    line-height: 1.4;
    white-space: pre-wrap;
    transition: bottom 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  }

  .subtitle-overlay.subtitle-up {
    bottom: 16%;
  }

  /* STRØMME-UI OG KONTROLLER */
  .ui {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.4s ease-in-out;
    z-index: 20;
  }

  .ui.hidden { 
    opacity: 0; 
    pointer-events: none; 
  }

  .ui:not(.hidden) .top-bar,
  .ui:not(.hidden) .controls,
  .ui:not(.hidden) .progress-container,
  .ui:not(.hidden) .caption-menu {
    pointer-events: auto;
  }

  /* TOPPBAR */
  .top-bar {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    padding: 25px 30px 60px 30px;
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0) 100%);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .top-bar-left {
    display: flex;
    align-items: center;
  }

  .back-button, 
  .back-button:visited, 
  .back-button:hover, 
  .back-button:active { 
    background: none; 
    border: none; 
    cursor: pointer; 
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease;
    text-decoration: none !important;
    outline: none;
  }
  .back-button:hover { transform: scale(1.1); }

  .movie-title {
    color: #fff;
    font-size: 20px;
    font-weight: 400;
    margin-left: 20px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }

  .watermark {
    position: absolute;
    top: 25px; right: 30px;
    width: 55px;
    opacity: 0.4;
    z-index: 10;
    pointer-events: none;
  }

  /* KONTROLLER I BUNN */
  .controls {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 30px 40px 25px 40px;
    background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.4) 40%, rgba(0,0,0,0) 100%);
  }

  .left-controls, .right-controls {
    display: flex;
    gap: 24px;
    align-items: center;
    min-width: 150px;
  }
  .right-controls { justify-content: flex-end; }

  .center-controls {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 35px;
  }

  .btn { 
    background: none; 
    border: none; 
    cursor: pointer; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    transition: transform 0.15s ease;
    padding: 5px;
  }
  .btn:hover { transform: scale(1.15); }
  .btn:active { transform: scale(0.95); }

  /* VOLUMKONTROLL */
  .volume-container {
    display: flex;
    flex-direction: row-reverse;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    z-index: 30;
    pointer-events: auto;
  }

  .volume-slider-wrapper {
    display: flex;
    align-items: center;
    max-width: 0;
    opacity: 0;
    transition: max-width 0.25s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.2s ease;
  }

  .volume-container:hover .volume-slider-wrapper,
  .volume-container:focus-within .volume-slider-wrapper {
    max-width: 110px;
    opacity: 1;
    padding: 0 5px; 
  }

  .volume-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100px;
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(to right, #ffffff var(--volume-percent, 100%), rgba(255, 255, 255, 0.3) var(--volume-percent, 100%));
    outline: none;
    cursor: pointer;
  }

  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ffffff; 
    box-shadow: none;
    cursor: pointer;
    transform: scale(1);
    transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1);
  }

  .volume-slider::-moz-range-thumb {
    width: 12px;
    height: 12px;
    border: none;
    border-radius: 50%;
    background: #ffffff; 
    box-shadow: none;
    cursor: pointer;
    transform: scale(1); 
    transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1);
  }

  .volume-slider::-webkit-slider-thumb:hover,
  .volume-slider::-moz-range-thumb:hover {
    transform: scale(1.25) !important;
  }

  /* PROGRESS BAR */
  .progress-container {
    position: absolute;
    bottom: 85px;
    left: 0;
    width: 100%;
    padding: 0 40px;
    z-index: 22;
  }

  .progress {
    width: 100%;
    height: 7px;
    background: rgba(255, 255, 255, 0.25);
    border-radius: 6px;
    position: relative;
    cursor: pointer;
  }

  .progress-filled {
    width: 0%;
    height: 100%;
    background: #ffffff; 
    border-radius: 6px;
    box-shadow: none; 
    transition: width 0.1s linear;
  }

  .thumb {
    position: absolute;
    top: 50%;
    left: 0%;
    width: 20px; 
    height: 20px; 
    background: #ffffff; 
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(1);
    box-shadow: none; 
    transition: transform 0.15s ease;
    z-index: 30;
  }

  .progress-container:hover .thumb { 
    transform: translate(-50%, -50%) scale(1.15); 
  }
  .thumb:hover {
    transform: translate(-50%, -50%) scale(1.2) !important; 
  }

  .time-display {
    position: absolute;
    bottom: 102px; 
    right: 40px;
    color: rgba(255, 255, 255, 0.7);
    font-size: 13px;
    font-weight: 500;
    z-index: 22;
    font-variant-numeric: tabular-nums;
  }

  /* MENYER & OVERLAYS */
  .caption-menu {
    position: absolute;
    bottom: 95px;
    right: 40px;
    background: rgba(15, 15, 15, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border-radius: 8px;
    padding: 16px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    display: none;
    min-width: 240px;
    z-index: 100;
  }

  .caption-menu-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    color: #fff;
  }

  .caption-menu-close {
    background: none;
    border: none;
    color: #aaa;
    cursor: pointer;
    font-size: 16px;
  }

  .caption-menu-grid { display: flex; gap: 15px; }
  .caption-column { flex: 1; }

  .caption-column-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #888;
    margin-bottom: 8px;
    font-weight: 600;
  }

  .caption-track-list button {
    display: block;
    width: 100%;
    padding: 8px 12px;
    margin: 3px 0;
    background: transparent;
    color: #eee;
    border: none;
    text-align: left;
    font-size: 14px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .caption-track-list button:hover, 
  .caption-track-list button.active {
    background: #0fddcb;
    color: #000;
    font-weight: 600;
  }

  .preview-box {
    position: absolute;
    bottom: 110px;
    width: 220px;
    height: 124px;
    background: #000;
    border: 2px solid #0fddcb;
    border-radius: 6px;
    overflow: hidden;
    display: none;
    z-index: 50;
    pointer-events: none;
    box-shadow: 0 10px 20px rgba(0,0,0,0.6);
  }
  .preview-box img { width: 100%; height: 100%; object-fit: cover; }
  
  .preview-time {
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    padding: 3px 0;
    background: rgba(0,0,0,0.7);
    position: absolute;
    bottom: 0; width: 100%;
    text-align: center;
  }

  .loading-spinner {
    position: absolute;
    top: 50%; left: 50%;
    width: 65px; height: 65px;
    margin: -32.5px 0 0 -32.5px;
    border: 5px solid rgba(255,255,255,0.1);
    border-top: 5px solid #0fddcb; 
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    z-index: 4;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .resume-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 99999;
  }
  
  .resume-box {
    background: rgba(20, 20, 20, 0.9);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 35px 40px;
    border-radius: 12px;
    text-align: center;
    max-width: 400px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  }
  
  .resume-box p { font-size: 19px; color: #fff; margin-bottom: 25px; font-weight: 300; }
  .resume-buttons { display: flex; gap: 15px; justify-content: center; }
  
  .resume-buttons button {
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .resume-buttons button:active { transform: scale(0.97); }

  #continueBtn { background: #0fddcb; color: #000; } 
  #continueBtn:hover { background: #0bc4b4; }
  #restartBtn { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
  #restartBtn:hover { background: rgba(255,255,255,0.2); }


  /* ==========================================================================
     2. SERIE- OG NEDTELLINGSFUNKSJONER (NEDERST)
     ========================================================================== */

  /* KNAPPER FOR INTRO/OUTRO & NESTE EPISODE INNI KONTROLLERNE */
  #nextEpisodeBtn {
    display: none;
    color: white;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 4px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
    margin-right: 15px;
    transition: background 0.2s ease;
  }
  #nextEpisodeBtn:hover {
    background: rgba(255, 255, 255, 0.25);
  }

  .skip-btn {
    position: absolute;
    right: 30px;
    bottom: 110px;
    display: none;
    padding: 12px 24px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 4px;
    background: rgba(15, 15, 15, 0.85);
    backdrop-filter: blur(10px);
    color: white;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 0.5px;
    cursor: pointer;
    z-index: 25;
    transition: all 0.2s;
  }
  .skip-btn:hover {
    background: rgba(255, 255, 255, 0.2);
  }

  /* FORBEDRET OVERLAY FOR AUTOPLAY / SERIENEDTELLING */
  #autoplayOverlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: 0 8%;
    background: linear-gradient(90deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.8) 60%, rgba(0,0,0,0.3) 100%);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    z-index: 50;
    color: #ffffff;
    pointer-events: auto;
  }

  .autoplay-card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    max-width: 520px;
  }

  .autoplay-subtitle {
    text-transform: uppercase;
    color: #0fddcb;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2.5px;
    margin-bottom: 10px;
  }

  .autoplay-title {
    font-size: 32px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 24px;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  /* Sirkulær nedtellingselement */
  .autoplay-countdown-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 80px;
    height: 80px;
    margin-bottom: 24px;
  }

  .autoplay-countdown-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .autoplay-countdown-svg circle {
    fill: none;
    stroke-width: 4;
  }

  .autoplay-countdown-bg {
    stroke: rgba(255, 255, 255, 0.15);
  }

  .autoplay-countdown-progress {
    stroke: #0fddcb;
    stroke-linecap: round;
    stroke-dasharray: 226; /* 2 * PI * r (r=36) */
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s linear;
  }

  .autoplay-countdown {
    font-size: 32px;
    font-weight: 800;
    color: #ffffff;
    z-index: 2;
    font-variant-numeric: tabular-nums;
  }

  .autoplay-actions {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .autoplay-btn {
    padding: 14px 28px;
    border-radius: 30px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: all 0.2s ease;
    outline: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .autoplay-btn:active {
    transform: scale(0.96);
  }

  #autoplayPlayNextBtn { 
    background: #0fddcb; 
    color: #000000; 
    box-shadow: 0 4px 15px rgba(15, 221, 203, 0.3);
  }
  #autoplayPlayNextBtn:hover { 
    background: #12f3df; 
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(15, 221, 203, 0.4);
  }

  #autoplayCancelBtn { 
    background: rgba(255, 255, 255, 0.1); 
    color: #ffffff; 
    border: 1px solid rgba(255, 255, 255, 0.2); 
  }
  #autoplayCancelBtn:hover { 
    background: rgba(255, 255, 255, 0.2); 
  }


  /* ==========================================================================
     3. RESPONSIVE REGLER (MOBIL / SKJERMSTØRRELLER)
     ========================================================================== */

  @media (max-width: 768px) {
    .top-bar { padding: 15px 20px; }
    .movie-title { font-size: 16px; margin-left: 12px; }
    .watermark { top: 15px; right: 20px; width: 40px; }

    /* Portrettmodus */
    @media (orientation: portrait) {
      .center-controls {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        gap: 35px;
        z-index: 30;
        pointer-events: auto;
        display: flex !important;
      }

      .center-controls .btn {
        background: rgba(0, 0, 0, 0.6) !important;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-radius: 50%;
        width: 65px; height: 65px;
        padding: 0;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .center-controls .btn svg, 
      .center-controls .btn i {
        transform: scale(1.4) !important; 
        color: #ffffff;
      }

      .controls { padding: 20px; padding-bottom: 35px; }
      .left-controls { display: none !important; }

      .right-controls {
        width: 100%;
        justify-content: space-between; 
        gap: 20px;
        display: flex !important;
      }

      .right-controls .btn {
        background: rgba(255, 255, 255, 0.15) !important;
        padding: 12px 20px;
        border-radius: 8px;
        height: auto;
        min-width: 50px;
      }
      
      .right-controls .btn svg,
      .right-controls .btn i {
        transform: scale(1.1) !important;
      }

      .progress-container { bottom: 95px; padding: 0 20px; }
      .progress { height: 5px; background: rgba(255, 255, 255, 0.2); }
      .thumb { width: 22px; height: 22px; transform: translate(-50%, -50%) scale(1) !important; }

      .time-display {
        bottom: 110px; right: 20px;
        font-size: 12px;
        background: rgba(0, 0, 0, 0.6);
        padding: 2px 6px;
        border-radius: 4px;
      }

      .subtitle-overlay { font-size: 20px; width: 85%; bottom: 20%; }
      .caption-menu { bottom: 145px; right: 20px; left: 20px; min-width: calc(100% - 40px); }
      .preview-box { bottom: 120px; }

      /* Responsiv serie-nedtelling på mobil */
      #autoplayOverlay { 
        padding: 30px 24px; 
        justify-content: center; 
        align-items: center;
        background: rgba(0, 0, 0, 0.94);
      }

      .autoplay-card {
        align-items: center;
        text-align: center;
      }

      .autoplay-title {
        font-size: 22px;
        max-width: 100%;
      }

      .autoplay-countdown-wrapper {
        width: 70px;
        height: 70px;
        margin-bottom: 20px;
      }

      .autoplay-countdown {
        font-size: 26px;
      }

      .autoplay-actions {
        flex-direction: column;
        width: 100%;
        max-width: 280px;
      }

      .autoplay-btn {
        width: 100%;
        padding: 14px;
      }
    }

    /* Landskapsmodus */
    @media (orientation: landscape) {
      .controls { padding: 15px 20px 20px 20px; }
      .left-controls, .right-controls { min-width: auto; gap: 16px; }
      .center-controls { gap: 24px; }
      .btn { padding: 10px; }
      .btn svg, .btn i { transform: scale(0.9); }
      .progress-container { bottom: 70px; padding: 0 20px; }
      .progress { height: 5px; }
      .thumb { transform: translate(-50%, -50%) scale(1) !important; width: 16px; height: 16px; }
      .time-display { bottom: 85px; right: 20px; font-size: 11px; }
      .subtitle-overlay { font-size: 18px; width: 90%; bottom: 8%; }
      .subtitle-overlay.subtitle-up { bottom: 22%; }
      .caption-menu { bottom: 85px; right: 20px; min-width: 160px; padding: 12px; }
      .preview-box { bottom: 90px; }

      #autoplayOverlay {
        padding-left: 6%;
      }

      .autoplay-title {
        font-size: 24px;
      }
    }
  }

  @media (max-width: 480px) {
    .movie-title { max-width: 140px; }
    #nextEpisodeBtn { font-size: 11px !important; }
    
    @media (orientation: portrait) {
      .center-controls { gap: 25px; }
      .center-controls .btn { width: 55px; height: 55px; }
    }
  }
</style>
</head>
<body>
  
  <div class="container" id="container">
  
  <!-- VIDEOSPILLER -->
  <div id="videoWrapper">
    <video id="video" preload="metadata" playsinline>
      <source src="" type="video/mp4">
      <track label="Norsk" kind="subtitles" srclang="no" src="" default>
      Din nettleser støtter ikke videoavspilling.
    </video>
  </div>

  <!-- OVERLAYS -->
  <div class="subtitle-overlay" id="subtitleOverlay"></div>
  <div class="loading-spinner" id="loadingSpinner"></div>

  <!-- INTRO / OUTRO KNAPPER -->
  <button id="skipIntroBtn" class="skip-btn">
    <i class="fa-solid fa-forward" style="margin-right: 5px;"></i> Hopp over intro
  </button>

  <button id="skipOutroBtn" class="skip-btn">
    Neste episode <i class="fa-solid fa-forward" style="margin-left: 5px;"></i>
  </button>

  <!-- AUTOPLAY OVERLAY (OPPDATERT MED STRUKTUR FOR JS) -->
  <div id="autoplayOverlay">
    <div class="autoplay-content">
      <img id="autoplayLogo" class="autoplay-serie-logo" alt="Serie Logo" style="display: none;">
      
      <div class="autoplay-episode-meta">
        <span id="autoplayEpTag" class="autoplay-ep-tag"></span>
        <span id="autoplayEpTitle" class="autoplay-ep-title"></span>
      </div>
      
      <p id="autoplayEpDesc" class="autoplay-ep-desc"></p>
      
      <div class="autoplay-action-row">
        <button id="autoplayPlayNextBtn" class="autoplay-btn">
          <i class="fa-solid fa-play"></i> Spill nå
        </button>
        <button id="autoplayCancelBtn" class="autoplay-btn">Avbryt</button>
        
        <div class="autoplay-circle-timer">
          <svg class="timer-svg" viewBox="0 0 36 36">
            <path class="timer-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            <path id="timerProgress" class="timer-progress" stroke-dasharray="100, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          </svg>
          <div id="autoplayCountdown" class="timer-number">8</div>
        </div>
      </div>
    </div>
  </div>

  <!-- RESUME DIALOG -->
  <div id="resumeOverlay" class="resume-overlay">
    <div class="resume-box">
      <p>Vil du fortsette der du slapp?</p>
      <div class="resume-buttons">
        <button id="continueBtn">Fortsett</button>
        <button id="restartBtn">Start på nytt</button>
      </div>
    </div>
  </div>

  <!-- HOVED-UI -->
  <div class="ui" id="ui">
    
    <div class="top-bar">
      <div class="top-bar-left">
        <a href="#" class="back-button" id="backButton">
          <i class="fa-solid fa-chevron-left" style="color: white; font-size: 20px;"></i>
        </a>
        <div class="movie-title">Laster tittel...</div>
      </div>
      
      <div class="volume-container">
        <button class="btn" id="muteBtn" title="Lyd av/på">
          <i class="fa-solid fa-volume-high" style="color: white; font-size: 18px;"></i>
        </button>
        <div class="volume-slider-wrapper">
          <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1" style="--volume-percent: 100%;">
        </div>
      </div>
    </div>

    <div class="progress-container">
      <div class="progress" id="progress">
        <div class="progress-filled" id="progressFilled"></div>
        <div class="thumb" id="thumb"></div>
      </div>
    </div>

    <div class="preview-box" id="previewBox">
      <img id="previewImage" src="" alt="Forhåndsvisning">
      <div class="preview-time" id="previewTime">00:00</div>
    </div>

    <span class="time-display" id="timeDisplay">00:00</span>

    <div class="controls">
      <div class="left-controls"></div>

      <div class="center-controls">
        <button class="btn" id="rewindBtn" title="10 sekunder tilbake">
          <i class="fa-solid fa-rotate-left" style="color: white; font-size: 20px;"></i>
        </button>
        <button class="btn" id="playPauseBtn" title="Spill / Pause">
          <i class="fa-solid fa-play" style="color: white; font-size: 24px;"></i>
        </button>
        <button class="btn" id="forwardBtn" title="10 sekunder frem">
          <i class="fa-solid fa-rotate-right" style="color: white; font-size: 20px;"></i>
        </button>
      </div>

      <div class="right-controls">
        <button id="nextEpisodeBtn" class="btn">
          Neste <i class="fa-solid fa-forward" style="margin-left: 3px; font-size: 12px;"></i>
        </button>
        
        <button class="btn" id="captionsBtn" title="Undertekster og lydspråk">
          <i class="fa-solid fa-closed-captioning" style="color: white; font-size: 20px;"></i>
        </button>
        <button class="btn" id="fullscreenBtn" title="Fullskjerm">
          <i class="fa-solid fa-expand" style="color: white; font-size: 20px;"></i>
        </button>
      </div>
    </div>

    <!-- MENY FOR LYD OG UNDERTEKSTER -->
    <div class="caption-menu" id="captionMenu">
      <div class="caption-menu-header">
        <h3>Lyd og undertekster</h3>
        <button class="caption-menu-close" id="closeCaptionMenuBtn" aria-label="Lukk">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      
      <div class="caption-menu-grid">
        <div class="caption-column">
          <div class="caption-column-title">Lyd</div>
          <div class="caption-track-list" id="audioTracks">
            <!-- Dynamisk innhold -->
          </div>
        </div>

        <div class="caption-column">
          <div class="caption-column-title">Undertekster</div>
          <div class="caption-track-list" id="subtitleTracks">
            <!-- Dynamisk innhold -->
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
  </div>
</div>
<script src="Filmdata.js"></script>
<script src="Seriedata.js"></script>
<script type="module">
/* ==========================================================================
   UNIVERSELL SPINNER & PLAYER – PREMIUM STRØMMETJENESTE-UTGAVE
   ========================================================================== */
import { db, auth } from './firebase-oppsett.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

const urlParams = new URLSearchParams(window.location.search);
const navn = urlParams.get("navn") || urlParams.get("id");
const sesong = urlParams.get("sesong") || urlParams.get("s");
const episode = urlParams.get("episode") || urlParams.get("e");
const returUrlParam = urlParams.get("returUrl");

let film;
let filmId = "";
let tilbakeUrl = returUrlParam ? decodeURIComponent(returUrlParam) : "Hovedside.html";
let isSerie = false;
let currentUser = null;
let heleProfilArrayet = [];

/* ================= 1. MEDIA RESOLVER ================= */
if (navn && typeof filmer !== "undefined" && filmer?.[navn] && !sesong && !episode) {
  film = filmer[navn];
  filmId = `film-${navn}`;
  if (!returUrlParam) tilbakeUrl = film.tilbakeUrl || `film.html?navn=${navn}`;
  isSerie = false;
} else if (navn && typeof serier !== "undefined" && serier?.[navn] && sesong && episode && serier[navn].sesonger?.[sesong]?.episoder?.[episode]) {
  const serie = serier[navn];
  const ep = serie.sesonger[sesong].episoder[episode];
  film = {
    ...ep,
    audioLanguages: serie.audioLanguages || [],
    subtitleLanguages: serie.subtitleLanguages || [],
    tittel: `${serie.tittel} – S${String(sesong).padStart(2, '0')}E${String(episode).padStart(2, '0')}: ${ep.tittel}`
  };
  filmId = `serie-${navn}-s${sesong}-e${episode}`;
  if (!returUrlParam) tilbakeUrl = `film.html?navn=${navn}`; 
  isSerie = true;
} else {
  alert("Ugyldig innhold");
  window.location.href = "Hovedside.html";
}

document.title = film.tittel;
const movieTitleEl = document.querySelector(".movie-title");
if (movieTitleEl && film?.tittel) movieTitleEl.textContent = film.tittel;

// Tilbakeknapp
const backButton = document.getElementById("backButton");
if (backButton) {
  backButton.innerHTML = '<i class="fa-solid fa-xmark" style="color: #ffffff; font-size: 26px; padding: 5px;"></i>';
  backButton.addEventListener("click", async (e) => {
    e.preventDefault();
    await lagreSistePosisjonEkspress();
    window.location.href = tilbakeUrl;
  });
}

// Initialiserer videoelementet
const video = document.getElementById("video");
const videoWrapper = document.getElementById("videoWrapper");
if (video) {
  const sourceTag = video.querySelector("source");
  if (sourceTag) sourceTag.src = film.videoUrl || film.video || film.src;
  const trackTag = video.querySelector("track");
  if (trackTag && film.subtitleUrl) trackTag.src = film.subtitleUrl;
  video.load();
}

/* ================= 2. DOM-ELEMENTER ================= */
const ui = document.getElementById("ui");
const playBtn = document.getElementById("playPauseBtn");
const muteBtn = document.getElementById("muteBtn");
const volumeSlider = document.querySelector(".volume-slider");
const rewindBtn = document.getElementById("rewindBtn");
const forwardBtn = document.getElementById("forwardBtn");
const progress = document.getElementById("progress");
const progressFilled = document.getElementById("progressFilled");
const thumb = document.getElementById("thumb");
const timeDisplay = document.getElementById("timeDisplay");
const captionsBtn = document.getElementById("captionsBtn");
const captionMenu = document.getElementById("captionMenu");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const container = document.getElementById("container");
const loadingSpinner = document.getElementById("loadingSpinner");
const previewBox = document.getElementById("previewBox");
const previewImage = document.getElementById("previewImage");
const previewTime = document.getElementById("previewTime");
const subtitleOverlay = document.getElementById("subtitleOverlay");
const resumeOverlay = document.getElementById("resumeOverlay");
const continueBtn = document.getElementById("continueBtn");
const restartBtn = document.getElementById("restartBtn");

const nextEpisodeBtn = document.getElementById("nextEpisodeBtn");
const autoplayOverlay = document.getElementById("autoplayOverlay");

// Elementer i det faste autoplay-overlayet
const autoplayLogo = document.getElementById("autoplayLogo");
const autoplayEpTag = document.getElementById("autoplayEpTag");
const autoplayEpTitle = document.getElementById("autoplayEpTitle");
const autoplayEpDesc = document.getElementById("autoplayEpDesc");
const autoplayPlayNextBtn = document.getElementById("autoplayPlayNextBtn");
const autoplayCancelBtn = document.getElementById("autoplayCancelBtn");

// Globale tilstandsvariabler
let isDragging = false;
let hideTimeout;
let globalSubtitleSetting = localStorage.getItem("global-subtitle-setting") || "off";
let subtitlesEnabled = globalSubtitleSetting !== "off";
let autoplayTriggered = false;
let autoplayAktiv = false;
let lokalLagringsInterval;
let autoplayTimer;
let lastVolume = localStorage.getItem("video-last-volume") || 1;

// Setter FontAwesome ikoner trygt
if (rewindBtn) rewindBtn.innerHTML = '<i class="fa-solid fa-rotate-left" style="color: #ffffff; font-size: 22px;"></i>';
if (forwardBtn) forwardBtn.innerHTML = '<i class="fa-solid fa-rotate-right" style="color: #ffffff; font-size: 22px;"></i>';
if (captionsBtn) captionsBtn.innerHTML = '<i class="fa-solid fa-closed-captioning" style="color: #ffffff; font-size: 22px;"></i>';
if (fullscreenBtn) fullscreenBtn.innerHTML = '<i class="fa-solid fa-expand" style="color: #ffffff; font-size: 22px;"></i>';
if (playBtn) playBtn.innerHTML = '<i class="fa-solid fa-play" style="color: #ffffff; font-size: 26px;"></i>';
if (muteBtn) muteBtn.innerHTML = '<i class="fa-solid fa-volume-high" style="color: #ffffff; font-size: 22px;"></i>';

function hentNesteEpisodeUrl() {
  if (isSerie && navn && sesong && episode && typeof serier !== "undefined" && serier?.[navn]) {
    const s = parseInt(sesong);
    const e = parseInt(episode);
    const serie = serier[navn];
    const returParam = returUrlParam ? `&returUrl=${encodeURIComponent(returUrlParam)}` : '';

    if (serie.sesonger[s]?.episoder?.[e + 1]) {
      return `film-mal.html?navn=${navn}&sesong=${s}&episode=${e + 1}${returParam}`;
    }
    if (serie.sesonger[s + 1]?.episoder?.[1]) {
      return `film-mal.html?navn=${navn}&sesong=${s + 1}&episode=1${returParam}`;
    }
  }
  return null;
}
const nesteEpisodeUrl = hentNesteEpisodeUrl();

if (nextEpisodeBtn) {
  if (isSerie && nesteEpisodeUrl) {
    nextEpisodeBtn.style.display = "inline-block";
    nextEpisodeBtn.onclick = () => { ryddeOgNeste(); };
  } else {
    nextEpisodeBtn.style.display = "none";
  }
}

function formatTime(time) {
  if (isNaN(time) || !isFinite(time)) return "00:00";
  const m = Math.floor(time / 60);
  const s = Math.floor(time % 60);
  return `${m}:${s < 10 ? '0' + s : s}`;
}

/* ================= 3. DB-LOGIKK (Firebase & LocalStorage) ================= */
const aktivProfilNavn = localStorage.getItem("aktivProfil") || "Hovedprofil";

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    const cacheData = localStorage.getItem("watch_nordic_profiles_cache");
    if (cacheData) {
      heleProfilArrayet = JSON.parse(cacheData);
    }
    try {
      const userDocRef = doc(db, "users", user.uid);
      const docSnap = await getDoc(userDocRef);
      if (docSnap.exists()) {
        heleProfilArrayet = docSnap.data().profiler || [];
        localStorage.setItem("watch_nordic_profiles_cache", JSON.stringify(heleProfilArrayet));
      }
    } catch (err) {
      console.error("Feil ved bakgrunnssynk:", err);
    }
    sjekkLagretFremdrift();
  } else {
    window.location.href = "index.html";
  }
});

function sjekkLagretFremdrift() {
  const profil = heleProfilArrayet.find(p => p.navn === aktivProfilNavn);
  if (!profil) {
    startVideoFraStart();
    return;
  }
  
  const fremdriftInfo = profil.fremdrift?.[filmId];
  const lagretTid = fremdriftInfo?.currentTime ? parseFloat(fremdriftInfo.currentTime) : 0;
  
  if (fremdriftInfo && lagretTid > 5 && fremdriftInfo.status !== "ferdig") {
    if (resumeOverlay) resumeOverlay.style.display = "flex";

    if (continueBtn) {
      continueBtn.onclick = () => {
        if (resumeOverlay) resumeOverlay.style.display = "none";
        video.currentTime = lagretTid;
        video.play().catch(() => {});
        
        // EKSPRESSLAGRING: Legg direkte inn i "Fortsett å se" med en gang
        oppdaterFremdriftILokalMatrise("paabegynt");
        startLokalLagringsLoop();
      };
    }
    
    if (restartBtn) {
      restartBtn.onclick = () => {
        if (resumeOverlay) resumeOverlay.style.display = "none";
        startVideoFraStart();
      };
    }
  } else {
    startVideoFraStart();
  }
}

function startVideoFraStart() {
  video.currentTime = 0;
  video.play().catch(() => {});
  
  // Sørger for at den registreres direkte som påbegynt fra sekund 0
  setTimeout(() => {
    oppdaterFremdriftILokalMatrise("paabegynt");
  }, 200);

  startLokalLagringsLoop();
}

function startLokalLagringsLoop() {
  clearInterval(lokalLagringsInterval);
  lokalLagringsInterval = setInterval(() => {
    oppdaterFremdriftILokalMatrise("paabegynt");
  }, 5000);
}

function oppdaterFremdriftILokalMatrise(status) {
  // Tillater lagring selv om video.currentTime er 0, så lenge video.duration finnes
  if (isNaN(video.currentTime) || isNaN(video.duration) || video.duration <= 0) return;
  
  const percent = parseFloat(((video.currentTime / video.duration) * 100).toFixed(1));
  let profilIdx = heleProfilArrayet.findIndex(p => p.navn === aktivProfilNavn);
  if (profilIdx === -1) return;

  if (!heleProfilArrayet[profilIdx].fremdrift) heleProfilArrayet[profilIdx].fremdrift = {};
  if (!heleProfilArrayet[profilIdx].historikk) heleProfilArrayet[profilIdx].historikk = {};

  if (status === "ferdig" || percent > 96) {
    delete heleProfilArrayet[profilIdx].fremdrift[filmId];
    heleProfilArrayet[profilIdx].historikk[navn] = "ferdig";
    
    localStorage.removeItem("progress_" + filmId);
    localStorage.removeItem("progress_" + navn);
    localStorage.removeItem(`${filmId}-lastPosition`);
  } else {
    heleProfilArrayet[profilIdx].fremdrift[filmId] = {
      currentTime: video.currentTime,
      percent: percent,
      status: "paabegynt",
      sistOppdatert: new Date().toISOString(),
      tittel: film.tittel,
      id: filmId,
      navn: navn,
      sesong: sesong || null,
      episode: episode || null
    };
    heleProfilArrayet[profilIdx].historikk[navn] = "påbegynt";
  }

  // Lagres umiddelbart til LocalStorage slik at Hovedsiden ser det med én gang
  localStorage.setItem("watch_nordic_profiles_cache", JSON.stringify(heleProfilArrayet));

  // Lagres også i bakgrunnen mot Firebase
  if (currentUser) {
    const userDocRef = doc(db, "users", currentUser.uid);
    setDoc(userDocRef, { profiler: heleProfilArrayet }, { merge: true }).catch(err => {
      console.error("Feil ved bakgrunnssynk:", err);
    });
  }
}

async function lagreSistePosisjonEkspress() {
  clearInterval(lokalLagringsInterval);
  const erFerdig = (video.currentTime / video.duration) > 0.96;
  oppdaterFremdriftILokalMatrise(erFerdig ? "ferdig" : "paabegynt");
}

async function ryddeOgNeste() {
  video.pause();
  clearInterval(lokalLagringsInterval);
  clearInterval(autoplayTimer);
  
  oppdaterFremdriftILokalMatrise("ferdig");
  
  if (isSerie && nesteEpisodeUrl) {
    window.location.href = nesteEpisodeUrl;
  } else {
    window.location.href = tilbakeUrl;
  }
}

window.addEventListener('beforeunload', () => {
  oppdaterFremdriftILokalMatrise((video.currentTime / video.duration) > 0.96 ? "ferdig" : "paabegynt");
  if (currentUser && navigator.sendBeacon) {
    const userDocRef = doc(db, "users", currentUser.uid);
    setDoc(userDocRef, { profiler: heleProfilArrayet }, { merge: true }).catch(() => {});
  }
});

/* ================= 4. MEDIEKONTROLLER OG UI-LOGIKK ================= */
function updateProgress() {
  if (!isDragging && video.duration) {
    const percent = (video.currentTime / video.duration) * 100;
    if (progressFilled) progressFilled.style.width = percent + '%';
    if (thumb) thumb.style.left = percent + '%';
  }
  if (timeDisplay) {
    timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
  }
}

video.addEventListener('timeupdate', updateProgress);

if (playBtn) playBtn.addEventListener('click', () => video.paused ? video.play() : video.pause());
video.addEventListener('click', () => video.paused ? video.play() : video.pause());

document.addEventListener('keydown', e => {
  if (["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) return;
  if (autoplayAktiv) return;
  if (e.code === 'Space') { e.preventDefault(); video.paused ? video.play() : video.pause(); }
  if (e.key === 'ArrowRight') video.currentTime = Math.min(video.duration, video.currentTime + 10);
  if (e.key === 'ArrowLeft') video.currentTime = Math.max(0, video.currentTime - 10);
});

video.addEventListener('play', () => { 
  if (playBtn) playBtn.innerHTML = '<i class="fa-solid fa-pause" style="color: #ffffff; font-size: 26px;"></i>'; 
  showUI(); 
});
video.addEventListener('pause', () => { 
  if (playBtn) playBtn.innerHTML = '<i class="fa-solid fa-play" style="color: #ffffff; font-size: 26px;"></i>'; 
  showUI(); 
});

/* ================= PREMIUM INTERAKTIV VOLUMLOGIKK ================= */
function oppdaterVolumIkon(vol, isMuted) {
  if (!muteBtn) return;
  if (isMuted || vol === 0) {
    muteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark" style="color: #ffffff; font-size: 22px;"></i>';
  } else if (vol < 0.4) {
    muteBtn.innerHTML = '<i class="fa-solid fa-volume-low" style="color: #ffffff; font-size: 22px;"></i>';
  } else {
    muteBtn.innerHTML = '<i class="fa-solid fa-volume-high" style="color: #ffffff; font-size: 22px;"></i>';
  }
}

function settVolum(volVal) {
  const vol = parseFloat(volVal);
  video.volume = vol;
  video.muted = (vol === 0);
  
  if (vol > 0) {
    lastVolume = vol;
    localStorage.setItem("video-last-volume", vol);
  }
  
  if (volumeSlider) {
    volumeSlider.value = vol;
    volumeSlider.style.setProperty('--volume-percent', `${vol * 100}%`);
  }
  oppdaterVolumIkon(vol, video.muted);
}

if (muteBtn) {
  muteBtn.addEventListener('click', () => {
    if (video.muted || video.volume === 0) {
      video.muted = false;
      settVolum(lastVolume > 0 ? lastVolume : 0.5);
    } else {
      video.muted = true;
      if (volumeSlider) {
        volumeSlider.value = 0;
        volumeSlider.style.setProperty('--volume-percent', '0%');
      }
      oppdaterVolumIkon(0, true);
    }
  });
}

if (volumeSlider) {
  settVolum(lastVolume);
  volumeSlider.addEventListener('input', (e) => {
    settVolum(e.target.value);
  });
}

if (rewindBtn) rewindBtn.addEventListener('click', () => video.currentTime = Math.max(0, video.currentTime - 10));
if (forwardBtn) forwardBtn.addEventListener('click', () => video.currentTime = Math.min(video.duration, video.currentTime + 10));

if (captionsBtn) {
  captionsBtn.addEventListener('click', () => { 
    if (captionMenu) captionMenu.style.display = captionMenu.style.display === 'block' ? 'none' : 'block'; 
  });
}

/* ================= 5. UNDERTEKSTER & LYDVALG ================= */
function updateSubtitleButtons(activeLang) {
  document.querySelectorAll("#subtitleTracks button").forEach(btn => {
    if (btn.dataset.lang === activeLang) { btn.classList.add("active"); } else { btn.classList.remove("active"); }
  });
}

const audioTracksDiv = document.getElementById("audioTracks");
if (audioTracksDiv) {
  audioTracksDiv.innerHTML = "";
  if (film.audioLanguages && film.audioLanguages.length > 0) {
    film.audioLanguages.forEach(lang => {
      const btn = document.createElement("button");
      btn.textContent = lang.label;
      btn.addEventListener("click", () => { if (captionMenu) captionMenu.style.display = "none"; });
      audioTracksDiv.appendChild(btn);
    });
  } else { audioTracksDiv.innerHTML = "<em style='color:gray;'>Standard lydspor</em>"; }
}

const subtitleTracksDiv = document.getElementById("subtitleTracks");
if (subtitleTracksDiv) {
  subtitleTracksDiv.innerHTML = "";

  if (film.subtitleLanguages && film.subtitleLanguages.length > 0) {
    film.subtitleLanguages.forEach(sub => {
      const btn = document.createElement("button");
      btn.textContent = sub.label; 
      btn.dataset.lang = sub.code;

      if (globalSubtitleSetting === sub.code) {
        btn.classList.add("active");
      }
      
      btn.addEventListener("click", () => {
        const selectedLang = sub.code; 
        globalSubtitleSetting = selectedLang; 
        localStorage.setItem("global-subtitle-setting", selectedLang);
        
        subtitlesEnabled = true;
        for (let i = 0; i < video.textTracks.length; i++) {
          const track = video.textTracks[i];
          if (track.language === selectedLang || track.label.toLowerCase() === selectedLang) {
            track.mode = "hidden"; 
            
            track.oncuechange = () => {
              if (!subtitlesEnabled) { if (subtitleOverlay) subtitleOverlay.textContent = ""; return; }
              const cues = track.activeCues; 
              if (subtitleOverlay) {
                subtitleOverlay.textContent = cues && cues.length > 0 ? cues[0].text : "";
              }
            };
          } else {
            track.mode = "disabled";
          }
        }
        updateSubtitleButtons(selectedLang); 
        if (captionMenu) captionMenu.style.display = "none";
      });
      subtitleTracksDiv.appendChild(btn);
    });
  }

  const offBtn = document.createElement("button");
  offBtn.textContent = "Av";
  offBtn.dataset.lang = "off";
  if (globalSubtitleSetting === "off") {
    offBtn.classList.add("active");
  }

  offBtn.addEventListener("click", () => {
    globalSubtitleSetting = "off";
    localStorage.setItem("global-subtitle-setting", "off");
    subtitlesEnabled = false;

    for (let i = 0; i < video.textTracks.length; i++) {
      video.textTracks[i].mode = "disabled";
    }
    if (subtitleOverlay) subtitleOverlay.textContent = "";

    updateSubtitleButtons("off");
    if (captionMenu) captionMenu.style.display = "none";
  });
  subtitleTracksDiv.appendChild(offBtn);
}

video.addEventListener('loadedmetadata', () => {
  updateProgress();
  if (globalSubtitleSetting !== "off") {
    const aktivKnapp = document.querySelector(`#subtitleTracks button[data-lang="${globalSubtitleSetting}"]`);
    if (aktivKnapp) {
      aktivKnapp.click();
    } else {
      subtitlesEnabled = false;
      for (let i = 0; i < video.textTracks.length; i++) video.textTracks[i].mode = "disabled";
      updateSubtitleButtons("off");
    }
  } else {
    subtitlesEnabled = false;
    for (let i = 0; i < video.textTracks.length; i++) video.textTracks[i].mode = "disabled";
    if (subtitleOverlay) subtitleOverlay.textContent = "";
    updateSubtitleButtons("off");
  }
});

function scrubTo(e) {
  if (!video.duration || !progress) return 0;
  const rect = progress.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const percent = Math.min(Math.max(0, x / rect.width), 1);
  if (progressFilled) progressFilled.style.width = percent * 100 + '%';
  if (thumb) thumb.style.left = percent * 100 + '%';
  return percent;
}

if (progress) {
  progress.addEventListener('mousedown', e => { isDragging = true; scrubTo(e); });
}
document.addEventListener('mouseup', e => { 
  if (isDragging) { 
    const percent = scrubTo(e); 
    video.currentTime = percent * video.duration; 
    isDragging = false; 
    hidePreview(); 
  } 
});
document.addEventListener('mousemove', e => { 
  if (isDragging) { 
    const percent = scrubTo(e); 
    video.currentTime = percent * video.duration; 
    showPreview(e); 
  } 
});

const hiddenVideo = document.createElement("video");
hiddenVideo.src = film.videoUrl || film.video || film.src; 
hiddenVideo.muted = true; 
hiddenVideo.crossOrigin = "anonymous";
hiddenVideo.preload = "auto";

const canvas = document.createElement("canvas"); 
const ctx = canvas.getContext("2d");
canvas.width = 240; 
canvas.height = 135;

hiddenVideo.addEventListener("seeked", () => {
  try {
    ctx.drawImage(hiddenVideo, 0, 0, canvas.width, canvas.height);
    if (previewImage) previewImage.src = canvas.toDataURL("image/jpeg");
  } catch (err) {}
});

function showPreview(e) {
  if (!video.duration || !previewBox || !progress) return;
  const rect = progress.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const percent = Math.min(Math.max(0, x / rect.width), 1);
  const time = percent * video.duration;
  
  previewBox.style.left = `${x - 120}px`; 
  previewBox.style.display = "block"; 
  if (previewTime) previewTime.textContent = formatTime(time);
  
  hiddenVideo.currentTime = time;
}
function hidePreview() { if (previewBox) previewBox.style.display = "none"; }
if (progress) {
  progress.addEventListener("mousemove", showPreview);
  progress.addEventListener("mouseleave", hidePreview);
}

// ================= AUTOMATISK SKJULING AV MUSEPEKER & KONTROLLER =================
function showUI() {
  if (autoplayAktiv) {
    document.body.classList.remove('no-cursor');
    return; 
  }

  if (ui) ui.classList.remove('hidden'); 
  document.body.classList.remove('no-cursor'); 
  if (subtitleOverlay) subtitleOverlay.classList.add("subtitle-up"); 
  clearTimeout(hideTimeout);
  
  hideTimeout = setTimeout(() => { 
    if (!video.paused && !isDragging) { 
      if (ui) ui.classList.add('hidden'); 
      document.body.classList.add('no-cursor'); 
      if (subtitleOverlay) subtitleOverlay.classList.remove("subtitle-up"); 
    } 
  }, 3000); 
}
document.addEventListener('mousemove', showUI);
document.addEventListener('keydown', showUI);

if (fullscreenBtn) {
  fullscreenBtn.addEventListener('click', () => { if (!document.fullscreenElement) { container.requestFullscreen(); } else { document.exitFullscreen(); } });
}
document.addEventListener('fullscreenchange', () => {
  if (fullscreenBtn) {
    fullscreenBtn.innerHTML = document.fullscreenElement 
      ? '<i class="fa-solid fa-compress" style="color: #ffffff; font-size: 22px;"></i>' 
      : '<i class="fa-solid fa-expand" style="color: #ffffff; font-size: 22px;"></i>';
  }
});

if (loadingSpinner) {
  video.addEventListener('waiting', () => loadingSpinner.style.display = 'block');
  video.addEventListener('playing', () => loadingSpinner.style.display = 'none');
}

video.addEventListener('ended', async () => { 
  await ryddeOgNeste(); 
});

/* ================= 6. AUTOPLAY METODE (STABIL OG REN) ================= */
const skipIntroBtn = document.getElementById("skipIntroBtn");
const skipOutroBtn = document.getElementById("skipOutroBtn");

video.addEventListener("timeupdate", () => {
  const tid = video.currentTime;

  if (isSerie && film.introStart != null && film.introEnd != null) {
    if (tid >= film.introStart && tid <= film.introEnd) {
      if (skipIntroBtn) skipIntroBtn.style.display = "block";
    } else {
      if (skipIntroBtn) skipIntroBtn.style.display = "none";
    }
  }

  if (video.duration && !isNaN(video.duration)) {
    const triggerTid = film.outroStart != null ? film.outroStart : (video.duration - 15);
    if (isSerie && nesteEpisodeUrl && tid >= triggerTid && !autoplayTriggered && !video.paused) {
      autoplayTriggered = true;
      startPremiumAutoplay();
    }
  }
});

if (skipIntroBtn) { skipIntroBtn.addEventListener("click", () => { video.currentTime = film.introEnd; }); }
if (skipOutroBtn) { skipOutroBtn.addEventListener("click", () => { ryddeOgNeste(); }); }

function startPremiumAutoplay() {
  if (!autoplayOverlay || !videoWrapper) return;
  
  autoplayAktiv = true;
  document.body.classList.remove('no-cursor');

  if (ui) {
    ui.style.pointerEvents = "none";
    ui.style.display = "none";
  }
  
  let nesteBildeUrl = "";
  let nesteTittel = "Neste episode";
  let nesteBeskrivelse = "";
  let nesteEpInfoText = "";
  let serieLogoUrl = "";

  if (isSerie && navn && sesong && episode && typeof serier !== "undefined" && serier?.[navn]) {
    const s = parseInt(sesong);
    const e = parseInt(episode);
    const serie = serier[navn];
    
    serieLogoUrl = serie.logo || "";

    let nesteEpData = serie.sesonger[s]?.episoder?.[e + 1] || serie.sesonger[s + 1]?.episoder?.[1];
    let nesteSNum = serie.sesonger[s]?.episoder?.[e + 1] ? s : s + 1;
    let nesteENum = serie.sesonger[s]?.episoder?.[e + 1] ? (e + 1) : 1;

    if (nesteEpData) {
      nesteBildeUrl = nesteEpData.thumbnail || nesteEpData.bildeUrl || serie.bakgrunnsbilde || serie.bakgrunns || "";
      nesteTittel = nesteEpData.tittel || "Neste episode";
      nesteBeskrivelse = nesteEpData.beskrivelse || "";
      nesteEpInfoText = `S${nesteSNum}:E${nesteENum}`;
    }
  }

  if (container && nesteBildeUrl) {
    container.style.backgroundImage = `url('${nesteBildeUrl}')`;
    container.style.backgroundSize = "cover";
    container.style.backgroundPosition = "center";
    container.style.backgroundRepeat = "no-repeat";
  }

  if (autoplayLogo) {
    if (serieLogoUrl) {
      autoplayLogo.src = serieLogoUrl;
      autoplayLogo.style.display = "block";
    } else {
      autoplayLogo.style.display = "none";
    }
  }
  if (autoplayEpTag) autoplayEpTag.textContent = nesteEpInfoText;
  if (autoplayEpTitle) autoplayEpTitle.textContent = nesteTittel;
  if (autoplayEpDesc) autoplayEpDesc.textContent = nesteBeskrivelse;

  if (autoplayPlayNextBtn) autoplayPlayNextBtn.onclick = () => ryddeOgNeste();
  if (autoplayCancelBtn) autoplayCancelBtn.onclick = () => avbrytAutoplay();

  container.classList.add("autoplay-active");
  autoplayOverlay.style.display = "flex";
  
  let teller = 8; 
  const totalTid = 8;
  const countdownEl = document.getElementById("autoplayCountdown");
  const progressPath = document.getElementById("timerProgress");

  if (countdownEl) countdownEl.textContent = teller;
  if (progressPath) progressPath.style.strokeDasharray = "100, 100";

  autoplayTimer = setInterval(() => {
    teller--;
    if (countdownEl) countdownEl.textContent = teller;
    
    if (progressPath) {
      const prosent = (teller / totalTid) * 100;
      progressPath.style.strokeDasharray = `${prosent}, 100`;
    }

    if (teller <= 0) {
      clearInterval(autoplayTimer);
      ryddeOgNeste();
    }
  }, 1000);
}

function avbrytAutoplay() {
  autoplayAktiv = false;
  clearInterval(autoplayTimer);
  if (autoplayOverlay) autoplayOverlay.style.display = "none";
  
  if (container) {
    container.style.backgroundImage = "";
    container.classList.remove("autoplay-active");
  }
  
  if (ui) {
    ui.style.pointerEvents = "auto";
    ui.style.display = ""; 
    showUI();
  }
  
  if (skipOutroBtn) {
    skipOutroBtn.style.display = "none";
  }
}

document.addEventListener("contextmenu", e => e.preventDefault());
</script>
