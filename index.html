      </a>
    </div>
  </header>

  <!-- SKJEMA-OMRÅDE -->
  <main class="main-content">
    <div class="container">
      <h2 id="formTitle">Logg inn</h2>
      <p class="subtitle" id="formSubtitle">Skriv inn e-postadressen din for å fortsette</p>

      <form id="authForm">
        
        <!-- TRINN 1: SKRIV INN E-POST -->
        <div id="steg1" class="step-content">
          <div class="input-group">
            <label for="epost">E-postadresse</label>
            <input type="email" id="epost" placeholder="navn@domene.no" autocomplete="email" required />
          </div>
          <button type="button" class="submit-btn" id="nesteKnapp">Neste</button>
        </div>

        <!-- TRINN 2: SKRIV INN PASSORD -->
        <div id="steg2" class="step-content spa-inline-login-1">
          
          <div class="selected-email-badge">
            <span id="visEpostTekst"></span>
            <button type="button" id="changeEmailBtn">Endre</button>
          </div>

          <div class="input-group spa-inline-login-2" id="navnGruppe">
            <label for="navn">Navn</label>
            <input type="text" id="navn" placeholder="Ditt fulle navn" autocomplete="name" />
          </div>

          <div class="input-group">
            <label for="passord">Passord</label>
            <div class="password-input-wrap">
              <input type="password" id="passord" placeholder="••••••••" autocomplete="current-password" />
              <button type="button" class="password-toggle" id="passwordToggle" aria-label="Vis passord">Vis</button>
            </div>
            <div class="forgot-text" id="forgotContainer">
              <a href="Passordfeil.html">Glemt passord?</a>
            </div>
          </div>

          <button type="submit" class="submit-btn" id="submitKnapp">Logg inn</button>
        </div>

        <div class="error" id="feilmelding"></div>
      </form>

      <div class="toggle-text" id="toggleText">
        Er du ikke medlem? <a href="#" id="toggleModeLink">Registrer deg</a>
      </div>
    </div>
  </main>
